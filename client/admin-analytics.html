<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — SproutNet Admin</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
.admin-layout{display:grid;grid-template-columns:230px 1fr;gap:1rem;align-items:start}
.admin-side{position:sticky;top:70px;display:flex;flex-direction:column;gap:.4rem}
.admin-side a{padding:.55rem .8rem;border-radius:8px;text-decoration:none;color:inherit;border:1px solid transparent}
.admin-side a.on{background:#fff;border-color:#e2e8f0;font-weight:700}
.admin-side .meta{font-size:.75rem;color:#64748b}
@media(max-width:760px){.admin-layout{grid-template-columns:1fr}.admin-side{position:static;flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<div id="sn-nav"></div>
<main class="container" style="max-width:1200px">
<div class="admin-layout">
<aside class="admin-side card">
  <a href="/admin"><strong>Overview</strong> <span class="meta">home</span></a>
  <a href="/admin/problems"><strong>Problems</strong> <span class="meta">moderation</span></a>
  <a href="/admin/solutions"><strong>Solutions</strong> <span class="meta">uploads</span></a>
  <a href="/admin/judging"><strong>Judging</strong> <span class="meta">queue</span></a>
  <a href="/admin/analytics" class="on"><strong>Analytics</strong> <span class="meta">metrics</span></a>
  <a href="/leaderboard"><strong>Leaderboard</strong> <span class="meta">scores</span></a>
  <a href="/dashboard" class="btn" style="text-align:center">← Back to Dashboard</a>
</aside>
<div>
  <div class="muted" style="font-size:.75rem;letter-spacing:.12em">ANALYTICS · METRICS</div>
  <h1>Analytics</h1>
  <p class="muted">Quick platform stats. (Counts are pulled live.)</p>
  <div id="msg"></div>
  <div class="grid" id="stats"><p class="muted">Loading…</p></div>
  <div class="card"><strong>Open problems by domain</strong><div id="domains"></div></div>
</div>
</div>
</main>
<script src="/assets/config.js"></script>
<script type="module">
import { api, requireRole, renderNav, esc, alertBox } from '/assets/app.js';
renderNav('dash');
const me = await requireRole('admin');
if (me) {
  try {
    const a = await api('/api/admin/analytics');
    const card = (l, v) => `<div class="card"><h2>${esc(v)}</h2><div class="muted">${esc(l)}</div></div>`;
    document.getElementById('stats').innerHTML =
      card('Problems', a.totalProblems) + card('Open', a.openProblems) + card('Pending', a.pendingProblems) +
      card('Users', a.totalUsers) + card('Students', a.students) + card('Posters', a.posters) +
      card('Admins', a.admins) + card('Enrollments', a.totalEnrollments) + card('Submissions', a.totalSubmissions) +
      card('Avg enrollments/problem', a.totalProblems ? (a.totalEnrollments / a.totalProblems).toFixed(1) : '—') +
      card('Avg submissions/problem', a.totalProblems ? (a.totalSubmissions / a.totalProblems).toFixed(1) : '—');
    document.getElementById('domains').innerHTML = a.domains.length
      ? `<table class="table"><tbody>${a.domains.map(d => `<tr><td><strong>${esc(d.domain)}</strong></td><td>${d.count}</td></tr>`).join('')}</tbody></table>`
      : `<p class="muted">No open problems.</p>`;
  } catch (e) { document.getElementById('msg').innerHTML = alertBox(e.message); }
}
</script>
</body>
</html>
