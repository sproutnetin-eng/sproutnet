<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog | SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>pre.wrap { white-space:pre-wrap; font-family:inherit; margin:0; }</style>
</head>
<body>
<div id="sn-nav"></div>
<div class="container">
  <div id="msg"></div>
  <p><a href="/blogs">← Back to Blogs</a></p>
  <div id="content"><p class="muted">Loading…</p></div>
</div>
<script src="/assets/config.js"></script>
<script type="module">
import { sb, api, esc, renderNav, alertBox } from '/assets/app.js';
renderNav('blogs');
const id = location.pathname.split('/')[2];
const plain = (body) => { try { const t = (body || '').trim();
    if (t.startsWith('{')) { const j = JSON.parse(t);
      const walk = (n) => n.text ? n.text : (n.content || []).map(walk).join('\n');
      return walk(j); } } catch {} return body || ''; };
let post = null, me = null, liked = false, likeCount = 0, comments = [];
const msg = (h) => { document.getElementById('msg').innerHTML = h; };

function render() {
  const meta = post.postType === 'question' ? 'Question / Doubt' : 'Knowledge Share';
  const roots = comments.filter(c => !c.parentId);
  document.title = `${post.title} | SproutNet`;
  document.getElementById('content').innerHTML = `
    ${post.cover_image ? `<img src="${esc(post.cover_image)}" alt="" style="width:100%;max-height:320px;object-fit:cover;border-radius:12px;">` : ''}
    <div><b>${esc(post.author?.name || 'SproutNet member')}</b> <span class="badge">${esc(meta)}</span>
      <span class="muted"> · ${esc(new Date(post.createdAt).toLocaleString('en-IN'))}</span></div>
    <h1>${esc(post.title)}</h1>
    <div class="card"><pre class="wrap">${esc(plain(post.body))}</pre></div>
    <div class="row">
      ${me ? `<button class="btn ${liked ? 'btn-primary' : ''}" id="like">${liked ? 'Liked' : 'Like'} · ${likeCount}</button>`
        : `<a class="btn" href="/login">Log in to like · ${likeCount}</a>`}
      <span class="muted">${comments.length} comment(s)</span>
    </div>
    <h3>Discussion</h3>
    ${me ? `<div class="card"><textarea class="textarea" id="c-body" placeholder="Add a comment…"></textarea>
      <button class="btn btn-primary" id="c-post">Post comment</button></div>` : ''}
    <div id="clist">${roots.length ? roots.map(c => {
      const reps = comments.filter(r => r.parentId === c.id);
      const canDel = me && c.author?.id === me.id;
      return `<div class="card"><div><b>${esc(c.author?.name || 'SproutNet member')}</b>
        <span class="muted"> · ${esc(new Date(c.createdAt).toLocaleString('en-IN'))}</span>
        ${canDel ? `<button class="btn btn-danger" data-del="${esc(c.id)}" style="float:right;">Delete</button>` : ''}</div>
        <pre class="wrap">${esc(c.body)}</pre>
        ${reps.map(r => `<div class="card" style="margin-left:1.5rem;"><div><b>${esc(r.author?.name || 'SproutNet member')}</b>
          <span class="muted"> · ${esc(new Date(r.createdAt).toLocaleString('en-IN'))}</span>
          ${me && r.author?.id === me.id ? `<button class="btn btn-danger" data-del="${esc(r.id)}" style="float:right;">Delete</button>` : ''}</div>
          <pre class="wrap">${esc(r.body)}</pre></div>`).join('')}
      </div>`; }).join('') : '<p class="muted">No comments yet.</p>'}</div>`;
  document.getElementById('like')?.addEventListener('click', async () => {
    try { const d = await api('/api/blogs/likes', { method:'POST', body:{ post_id:id } });
      liked = d.liked; likeCount += liked ? 1 : -1; render();
    } catch (e) { msg(alertBox(e.message)); }
  });
  document.getElementById('c-post')?.addEventListener('click', async (e) => {
    const body = document.getElementById('c-body').value.trim();
    if (!body) return; e.target.disabled = true;
    try { const d = await api('/api/blogs/comments', { method:'POST', body:{ post_id:id, body } });
      if (d.comment) comments.push(d.comment); document.getElementById('c-body').value = ''; render();
    } catch (err) { msg(alertBox(err.message)); } e.target.disabled = false;
  });
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Delete this comment? Replies under it will also be removed.')) return;
    try { await api('/api/blogs/comments', { method:'DELETE', body:{ comment_id: b.dataset.del } });
      comments = comments.filter(c => c.id !== b.dataset.del && c.parentId !== b.dataset.del); render();
    } catch (e) { msg(alertBox(e.message)); }
  }));
}

try {
  const { data: { session } } = await sb().auth.getSession();
  if (session) { try { const r = await api('/api/auth/profile'); me = r.profile ? { id: r.profile.id, name: r.profile.name } : null; } catch {} }
  const d = await api(`/api/blogs/posts?id=${encodeURIComponent(id)}`);
  post = d.post; liked = !!post.likedByViewer; likeCount = post.likesCount || 0; comments = post.comments || [];
  render();
} catch (e) {
  document.getElementById('content').innerHTML = `<div class="card"><h2>Post not found</h2><a href="/blogs">← Back to blogs</a></div>`;
  if (!/404|not found/i.test(e.message)) msg(alertBox(e.message));
}
</script>
</body>
</html>
