<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Blogs | SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
.manage-wrap { max-width: 1180px; margin: 0 auto; padding: clamp(32px, 6vw, 52px) clamp(16px, 4vw, 24px); }
.manage-hero { background: #fff; border-radius: 24px; padding: clamp(20px, 4vw, 32px); margin-bottom: 24px; border: 1px solid rgba(28,20,16,0.08); }
.manage-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #2D6A4F; margin-bottom: 10px; }
.manage-hero-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.manage-hero-t { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 700; color: #1C1410; margin-bottom: 6px; }
.manage-hero-d { font-size: 14px; color: #5C524A; }
.manage-hero-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-write { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; color: #1C1410; background: #F4A723; padding: 10px 18px; border-radius: 10px; text-decoration: none; box-shadow: 0 4px 14px rgba(244,167,35,0.24); }
.btn-feed { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; color: #1C1410; background: #F6F2EB; padding: 10px 16px; border-radius: 10px; text-decoration: none; border: 1px solid rgba(28,20,16,0.08); }
.blogs-manage-layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, 0.9fr); gap: 24px; align-items: start; }
@media (max-width: 980px) { .blogs-manage-layout, .blogs-layout { grid-template-columns: 1fr; } }
.mypanel { background: #fff; border-radius: 20px; padding: 22px; border: 1px solid rgba(28,20,16,0.08); box-shadow: 0 10px 24px rgba(28,20,16,0.05); }
.mypanel .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #2D6A4F; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
.mypanel .t { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; color: #1C1410; margin-bottom: 10px; }
.mypanel .d { font-size: 13px; color: #6A5F58; line-height: 1.7; margin-bottom: 18px; }
.post-card { border: 1px solid rgba(28,20,16,0.06); border-radius: 14px; padding: 14px 16px; background: #FAF8F4; margin-bottom: 12px; }
.post-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.post-title { font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700; color: #1C1410; line-height: 1.3; }
.post-meta { font-size: 12px; color: #6A5F58; margin-top: 4px; }
.post-type { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #EAF4EE; color: #2D6A4F; }
.post-type.q { background: rgba(30,64,175,0.1); color: #1E40AF; }
.post-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.pbtn { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700; border: none; border-radius: 999px; padding: 6px 10px; cursor: pointer; }
.pbtn.comments { color: #2D6A4F; background: rgba(45,106,79,0.12); }
.pbtn.likes { color: #1E40AF; background: rgba(30,64,175,0.12); }
.pbtn.edit { color: #1C1410; background: #F4A723; }
.pbtn.del { color: #FAF8F4; background: #DC2626; }
.pbtn.save { color: #FAF8F4; background: #2D6A4F; border-radius: 999px; padding: 8px 12px; }
.pbtn.cancel { color: #1C1410; background: #F6F2EB; border-radius: 999px; padding: 8px 12px; }
.post-body { font-size: 13px; color: #3F352E; line-height: 1.7; white-space: pre-wrap; }
.post-edit input, .post-edit textarea { width: 100%; border: 1px solid rgba(28,20,16,0.12); border-radius: 10px; padding: 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1C1410; outline: none; box-sizing: border-box; }
.post-edit textarea { border-radius: 12px; line-height: 1.6; }
.post-edit .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 10px; }
.side-box { margin-top: 12px; background: #fff; border-radius: 12px; padding: 12px; font-size: 12px; color: #7A7068; }
.like-chip { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; color: #1C1410; background: #F6F2EB; padding: 6px 10px; border-radius: 999px; }
.manage-err { background: rgba(220,38,38,0.06); border: 1px solid rgba(220,38,38,0.15); border-radius: 12px; padding: 12px 14px; font-size: 12px; color: #B91C1C; margin-bottom: 14px; }
</style>
</head>
<body>
<div id="sn-nav"></div>
<div class="manage-wrap">
  <div id="msg"></div>
  <section class="manage-hero">
    <div class="manage-eyebrow">// your blog desk</div>
    <div class="manage-hero-top">
      <div><div class="manage-hero-t">Write new posts and track your history</div><div class="manage-hero-d">Everything you publish appears here so you can refine, respond, and keep momentum.</div></div>
      <div class="manage-hero-btns"><a class="btn-write" href="/blogs/new">Write new post →</a><a class="btn-feed" href="/blogs">Back to feed</a></div>
    </div>
  </section>
  <div class="blogs-manage-layout">
    <div id="content" role="status" aria-label="Loading your posts"><span class="sr-only">Loading your posts...</span><div aria-hidden="true"><div class="sk-card" style="margin-bottom:14px"><div class="sk sk-line" style="width:30%;margin-bottom:4px"></div><div class="sk" style="height:22px;width:75%;margin-bottom:4px"></div><div class="sk sk-line" style="width:100%"></div><div class="sk sk-line" style="width:88%"></div></div><div class="sk-card"><div class="sk sk-line" style="width:28%;margin-bottom:4px"></div><div class="sk" style="height:22px;width:70%;margin-bottom:4px"></div><div class="sk sk-line" style="width:95%"></div></div></div></div>
    <aside class="mypanel" id="side"><div class="eyebrow">// your posts</div><div class="t">Previous posts</div><div class="d">Edit your posts and review who is engaging with them.</div><div id="sidemeta"></div></aside>
  </div>
</div>
<script src="/assets/config.js"></script>
<script type="module">
import { api, esc, requireAuth, renderNav, alertBox } from '/assets/app.js';
renderNav();
const msg = document.getElementById('msg');
const content = document.getElementById('content');

const s = await requireAuth();
if (s) {
  try {
    const { posts } = await api('/api/student/posts');
    const bodyText = (j) => {
      if (!j) return '';
      if (typeof j === 'string') return j;
      if (Array.isArray(j.content)) return j.content.map(bodyText).join(' ');
      return (j.text || '') + (Array.isArray(j.content) ? ' ' + j.content.map(bodyText).join(' ') : '');
    };
    const strip = (b) => { try { const j = JSON.parse(b); return bodyText(j); } catch { return (b || '').replace(/<[^>]*>/g, ' '); } };
    document.getElementById('sidemeta').innerHTML = `<div style="font-size:13px;color:#6A5F58">${posts.length} post(s) published.</div>`;
    content.innerHTML = posts.length ? posts.map(p => `
      <div class="post-card" data-post="${esc(p.id)}">
        <div class="post-top">
          <div><span class="post-type ${p.postType === 'question' ? 'q' : ''}">${esc(p.postType === 'question' ? 'Question / Doubt' : 'Knowledge Share')}</span>
          <div class="post-title" style="margin-top:6px">${esc(p.title)}</div>
          <div class="post-meta">${esc(p.createdAt ? new Date(p.createdAt).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '')} · ❤️ ${p.likesCount} · 💬 ${p.commentsCount}</div></div>
          <div class="post-btns">
            <button class="pbtn comments" data-comments="${esc(p.id)}">Comments (${p.commentsCount})</button>
            <button class="pbtn likes" data-likes="${esc(p.id)}">Likes (${p.likesCount})</button>
            <button class="pbtn edit" data-edit="${esc(p.id)}">Edit</button>
            <button class="pbtn del" data-del="${esc(p.id)}">Delete</button>
          </div>
        </div>
        <div class="post-body" data-view>${esc(strip(p.body)).slice(0, 400)}</div>
        <div class="post-edit" data-form style="display:none">
          <input data-ftitle value="${esc(p.title)}" style="margin-bottom:10px">
          <textarea data-fbody rows="4"></textarea>
          <div class="row"><button class="pbtn save" data-save="${esc(p.id)}">Save changes</button><button class="pbtn cancel" data-cancel="${esc(p.id)}">Cancel</button></div>
        </div>
        <div class="side-box" data-cbox style="display:none">No comments yet.</div>
        <div class="side-box" data-lbox style="display:none">${p.likesCount === 0 ? 'No likes yet.' : `${p.likesCount} like(s) recorded.`}</div>
      </div>`).join('')
      : '<div class="mypanel"><div class="t">No posts from you yet</div><div class="d">Write your first knowledge share or question. It will show up here once published.</div><a class="btn-write" href="/blogs/new">Write new post →</a></div>';

    const bodies = new Map(posts.map(p => [p.id, strip(p.body)]));
    document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => {
      const card = b.closest('[data-post]');
      card.querySelector('[data-view]').style.display = 'none';
      card.querySelector('[data-form]').style.display = '';
      card.querySelector('[data-fbody]').value = bodies.get(b.dataset.edit) || '';
    }));
    document.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', () => {
      const card = b.closest('[data-post]');
      card.querySelector('[data-view]').style.display = '';
      card.querySelector('[data-form]').style.display = 'none';
    }));
    document.querySelectorAll('[data-comments]').forEach(b => b.addEventListener('click', () => {
      const card = b.closest('[data-post]');
      const box = card.querySelector('[data-cbox]');
      const show = box.style.display === 'none';
      box.style.display = show ? '' : 'none';
      b.textContent = show ? 'Hide comments' : `Comments (${posts.find(p => p.id === b.dataset.comments)?.commentsCount ?? 0})`;
    }));
    document.querySelectorAll('[data-likes]').forEach(b => b.addEventListener('click', () => {
      const card = b.closest('[data-post]');
      const box = card.querySelector('[data-lbox]');
      const show = box.style.display === 'none';
      box.style.display = show ? '' : 'none';
      b.textContent = show ? 'Hide likes' : `Likes (${posts.find(p => p.id === b.dataset.likes)?.likesCount ?? 0})`;
    }));
    document.querySelectorAll('[data-save]').forEach(b => b.addEventListener('click', async () => {
      const card = b.closest('[data-post]');
      const title = card.querySelector('[data-ftitle]').value.trim();
      const body = card.querySelector('[data-fbody]').value.trim();
      if (!title) { msg.innerHTML = alertBox('Title is required.'); return; }
      if (!body) { msg.innerHTML = alertBox('Post body is required.'); return; }
      b.disabled = true; b.textContent = 'Saving...';
      try {
        await api('/api/blogs/posts', { method: 'PATCH', body: { post_id: b.dataset.save, title, body } });
        location.reload();
      } catch (err) { msg.innerHTML = alertBox(err.message); b.disabled = false; b.textContent = 'Save changes'; }
    }));
    document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Delete this post? This cannot be undone.')) return;
      b.disabled = true; b.textContent = 'Deleting...';
      try {
        await api('/api/blogs/posts', { method: 'DELETE', body: { post_id: b.dataset.del } });
        location.reload();
      } catch (err) { msg.innerHTML = alertBox(err.message); b.disabled = false; b.textContent = 'Delete'; }
    }));
  } catch (err) { msg.innerHTML = alertBox(err.message); content.innerHTML = ''; }
}
</script>
</body>
</html>
