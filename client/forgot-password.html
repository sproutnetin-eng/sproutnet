<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password | SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .auth-wrap { min-height: 100vh; background: #FAF8F4; display: flex; align-items: center; justify-content: center; padding: 48px 16px; box-sizing: border-box; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E"); }
  .auth-inner { width: 100%; max-width: 440px; }
  .auth-head { text-align: center; margin-bottom: 40px; }
  .auth-logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 24px; }
  .auth-logo span { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 20px; color: #1C1410; }
  .auth-head h1 { font-family: 'Instrument Serif', Georgia, serif; font-size: 32px; font-weight: 400; color: #1C1410; letter-spacing: -0.5px; line-height: 1.1; display: block; margin: 0; }
  .auth-head p { font-family: 'DM Sans', sans-serif; font-size: 15px; color: #4A3F38; margin-top: 8px; margin-bottom: 0; font-weight: 300; }
  .auth-card { background: #fff; border: 1.5px solid rgba(28,20,16,0.08); border-radius: 14px; padding: 36px 40px; box-shadow: 0 4px 24px rgba(28,20,16,0.07); }
  .auth-form { display: flex; flex-direction: column; gap: 20px; }
  .auth-err { background: rgba(220,38,38,0.06); border: 1px solid rgba(220,38,38,0.2); border-radius: 8px; padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: #DC2626; }
  .fld { display: flex; flex-direction: column; gap: 6px; }
  .fld label { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: #1C1410; }
  .fld input { font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1C1410; background: #FAF8F4; border: 1.5px solid rgba(28,20,16,0.12); border-radius: 8px; padding: 11px 14px; outline: none; width: 100%; box-sizing: border-box; }
  .fld input:focus { border-color: #2D6A4F; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 44px !important; }
  .pw-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #9CA3A0; padding: 8px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .pw-toggle:hover { color: #1C1410; background: rgba(28,20,16,0.06); }
  .fld input.otp { font-size: 24px; letter-spacing: 12px; text-align: center; font-weight: 600; }
  .auth-btn { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; color: #1C1410; background: #F4A723; border: none; border-radius: 8px; padding: 13px; cursor: pointer; margin-top: 4px; box-shadow: 0 2px 10px rgba(244,167,35,0.3); width: 100%; }
  .auth-btn:disabled { background: #F9C05A; cursor: not-allowed; }
  .resend-line { font-family: 'DM Sans', sans-serif; font-size: 13px; color: #9CA3A0; margin: 0; }
  .resend-line button { background: none; border: none; padding: 0; color: #2D6A4F; font-weight: 600; font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .back-link { background: none; border: none; padding: 0; color: #9CA3A0; font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; text-align: center; }
  .done-wrap { text-align: center; display: flex; flex-direction: column; gap: 16px; }
  .done-check { width: 56px; height: 56px; margin: 0 auto; background: rgba(45,106,79,0.08); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .done-wrap p { font-family: 'DM Sans', sans-serif; font-size: 14px; color: #4A3F38; margin: 0; }
  .auth-foot { font-family: 'DM Sans', sans-serif; font-size: 12px; color: #9CA3A0; text-align: center; margin-top: 20px; margin-bottom: 0; }
  .auth-foot a { color: #2D6A4F; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div id="sn-nav"></div>
<div class="auth-wrap">
  <div class="auth-inner">
    <div class="auth-head">
      <a class="auth-logo" href="/">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
          <rect width="34" height="34" rx="8" fill="#2D6A4F"/>
          <line x1="17" y1="27" x2="17" y2="15" stroke="#FAF8F4" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M17 21 C16 19 13 18 11 14.5 C11 14.5 15.5 13 17 17.5" fill="#F4A723"/>
          <path d="M17 18 C18 15.5 21.5 14 24 10.5 C24 10.5 19.5 10 17 14.5" fill="rgba(250,248,244,0.88)"/>
        </svg>
        <span>SproutNet</span>
      </a>
      <h1>Reset your password</h1>
      <p id="sub">We&#39;ll email you a 6-digit code to reset it.</p>
    </div>
    <div class="auth-card">
      <div id="msg"></div>
      <form class="auth-form" id="f-email" style="margin-top:16px">
        <div class="fld">
          <label for="email">College email</label>
          <input type="email" id="email" required placeholder="you@jyothyit.ac.in">
        </div>
        <button class="auth-btn" type="submit" id="btn1">Send code →</button>
      </form>
      <form class="auth-form" id="f-otp" style="display:none;margin-top:16px">
        <div class="fld">
          <label for="otp">6-digit code</label>
          <input class="otp" id="otp" required inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
        </div>
        <p class="resend-line" id="resendwrap">Didn&#39;t get it? <span id="timer"></span><button type="button" id="resend">Resend code</button></p>
        <button class="auth-btn" type="submit">Verify code →</button>
        <button class="back-link" type="button" id="back1">← Back</button>
      </form>
      <form class="auth-form" id="f-pass" style="display:none;margin-top:16px">
        <div class="fld">
          <label for="pw">New password</label>
          <div class="pw-wrap">
            <input type="password" id="pw" required minlength="8" placeholder="At least 8 characters">
            <button type="button" class="pw-toggle" data-target="pw" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <div class="fld">
          <label for="pw2">Confirm new password</label>
          <div class="pw-wrap">
            <input type="password" id="pw2" required minlength="8" placeholder="Re-enter password">
            <button type="button" class="pw-toggle" data-target="pw2" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <button class="auth-btn" type="submit" id="btn3">Reset password →</button>
        <button class="back-link" type="button" id="back2">← Back</button>
      </form>
      <div class="done-wrap" id="done" style="display:none">
        <div class="done-check">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2D6A4F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        </div>
        <p>You can now sign in with your new password.</p>
        <a class="auth-btn" href="/login" style="text-decoration:none;text-align:center;display:block">Back to login →</a>
      </div>
    </div>
    <p class="auth-foot"><a href="/login">Back to role selection</a></p>
  </div>
</div>
<script src="/assets/config.js"></script>
<script type="module">
import { api, renderNav, alertBox } from '/assets/app.js';
renderNav();
document.querySelectorAll('.pw-toggle').forEach((btn) => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    if (!input) return;
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    btn.innerHTML = show
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  });
});
const msg = document.getElementById('msg');
const sub = document.getElementById('sub');
const show = (id) => ['f-email', 'f-otp', 'f-pass', 'done'].forEach(x => document.getElementById(x).style.display = x === id ? (x === 'done' ? '' : 'flex') : 'none');
if (document.getElementById('done').style.display !== 'none') document.getElementById('done').style.display = 'none';
let resendIn = 0;
function tick() {
  const t = document.getElementById('timer');
  const r = document.getElementById('resend');
  if (resendIn > 0) { t.textContent = `Resend in ${resendIn}s `; r.style.display = 'none'; resendIn--; setTimeout(tick, 1000); }
  else { t.textContent = ''; r.style.display = ''; }
}
function errBox(m) { return `<div class="auth-err">${m}</div>`; }
async function sendCode() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('btn1');
  btn.disabled = true; btn.textContent = 'Sending...'; msg.innerHTML = '';
  try {
    await api('/api/auth/forgot-password', { method: 'POST', body: { email } });
    show('f-otp'); sub.textContent = `Enter the code sent to ${email}.`;
    resendIn = 60; tick(); document.getElementById('otp').value = '';
  } catch (err) { msg.innerHTML = errBox(err.message); }
  btn.disabled = false; btn.textContent = 'Send code →';
}
document.getElementById('f-email').addEventListener('submit', (e) => { e.preventDefault(); sendCode(); });
document.getElementById('resend').addEventListener('click', (e) => { e.preventDefault(); if (resendIn <= 0) sendCode(); });
document.getElementById('f-otp').addEventListener('submit', (e) => {
  e.preventDefault();
  const otp = document.getElementById('otp').value.replace(/\D/g, '').slice(0, 6);
  if (otp.length !== 6) { msg.innerHTML = errBox('Enter the 6-digit code from your email.'); return; }
  document.getElementById('otp').value = otp; msg.innerHTML = '';
  show('f-pass'); sub.textContent = 'Choose a new password for your account.';
});
document.getElementById('f-pass').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const otp = document.getElementById('otp').value;
  const password = document.getElementById('pw').value;
  if (password.length < 8) { msg.innerHTML = errBox('New password must be at least 8 characters.'); return; }
  if (password !== document.getElementById('pw2').value) { msg.innerHTML = errBox('Passwords do not match.'); return; }
  const btn = document.getElementById('btn3');
  btn.disabled = true; btn.textContent = 'Updating...'; msg.innerHTML = '';
  try {
    await api('/api/auth/reset-password', { method: 'POST', body: { email, otp, password } });
    show('done'); sub.textContent = 'Your password has been updated.';
  } catch (err) {
    msg.innerHTML = errBox(err.message);
    if (/Incorrect|expired/.test(err.message)) { show('f-otp'); document.getElementById('otp').value = ''; }
  }
  btn.disabled = false; btn.textContent = 'Reset password →';
});
document.getElementById('back1').addEventListener('click', (e) => { e.preventDefault(); msg.innerHTML = ''; show('f-email'); sub.textContent = "We'll email you a 6-digit code to reset it."; });
document.getElementById('back2').addEventListener('click', (e) => { e.preventDefault(); msg.innerHTML = ''; show('f-otp'); });
document.getElementById('otp').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });
</script>
</body>
</html>
