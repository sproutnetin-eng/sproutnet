<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password | SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div id="sn-nav"></div>
<div class="container" style="max-width:440px">
  <div class="card" style="text-align:center">
    <h1>Reset your password</h1>
    <p class="muted" id="sub">We'll email you a 6-digit code to reset it.</p>
  </div>
  <div class="card">
    <div id="msg"></div>
    <form id="f-email">
      <label>College email<input class="input" type="email" id="email" required placeholder="you@jyothyit.ac.in"></label>
      <button class="btn btn-primary" style="width:100%" type="submit" id="btn1">Send code →</button>
    </form>
    <form id="f-otp" style="display:none">
      <label>6-digit code<input class="input" id="otp" required inputmode="numeric" maxlength="6" placeholder="••••••" style="font-size:24px;letter-spacing:12px;text-align:center"></label>
      <p class="muted" id="resendwrap">Didn't get it? <a href="#" id="resend">Resend code</a> <span id="timer"></span></p>
      <button class="btn btn-primary" style="width:100%" type="submit">Verify code →</button>
      <p style="text-align:center"><a href="#" id="back1">← Back</a></p>
    </form>
    <form id="f-pass" style="display:none">
      <label>New password<input class="input" type="password" id="pw" required minlength="8" placeholder="At least 8 characters"></label>
      <label>Confirm new password<input class="input" type="password" id="pw2" required minlength="8"></label>
      <button class="btn btn-primary" style="width:100%" type="submit" id="btn3">Reset password →</button>
      <p style="text-align:center"><a href="#" id="back2">← Back</a></p>
    </form>
    <div id="done" style="display:none;text-align:center">
      <p>You can now sign in with your new password.</p>
      <a class="btn btn-primary" href="/login">Back to login →</a>
    </div>
  </div>
  <p class="muted" style="text-align:center"><a href="/login">Back to role selection</a></p>
</div>
<script src="/assets/config.js"></script>
<script type="module">
import { api, renderNav, alertBox } from '/assets/app.js';
renderNav('login');
const msg = document.getElementById('msg');
const sub = document.getElementById('sub');
const show = (id) => ['f-email', 'f-otp', 'f-pass', 'done'].forEach(x => document.getElementById(x).style.display = x === id ? '' : 'none');
let resendIn = 0;
function tick() {
  const t = document.getElementById('timer');
  if (resendIn > 0) { t.textContent = `(Resend in ${resendIn}s)`; resendIn--; setTimeout(tick, 1000); }
  else t.textContent = '';
}
async function sendCode() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('btn1');
  btn.disabled = true; btn.textContent = 'Sending...'; msg.innerHTML = '';
  try {
    await api('/api/auth/forgot-password', { method: 'POST', body: { email } });
    show('f-otp'); sub.textContent = `Enter the code sent to ${email}.`;
    resendIn = 60; tick(); document.getElementById('otp').value = '';
  } catch (err) { msg.innerHTML = alertBox(err.message); }
  btn.disabled = false; btn.textContent = 'Send code →';
}
document.getElementById('f-email').addEventListener('submit', (e) => { e.preventDefault(); sendCode(); });
document.getElementById('resend').addEventListener('click', (e) => { e.preventDefault(); if (resendIn <= 0) sendCode(); });
document.getElementById('f-otp').addEventListener('submit', (e) => {
  e.preventDefault();
  const otp = document.getElementById('otp').value.replace(/\D/g, '').slice(0, 6);
  if (otp.length !== 6) { msg.innerHTML = alertBox('Enter the 6-digit code from your email.'); return; }
  document.getElementById('otp').value = otp; msg.innerHTML = '';
  show('f-pass'); sub.textContent = 'Choose a new password for your account.';
});
document.getElementById('f-pass').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const otp = document.getElementById('otp').value;
  const password = document.getElementById('pw').value;
  if (password.length < 8) { msg.innerHTML = alertBox('New password must be at least 8 characters.'); return; }
  if (password !== document.getElementById('pw2').value) { msg.innerHTML = alertBox('Passwords do not match.'); return; }
  const btn = document.getElementById('btn3');
  btn.disabled = true; btn.textContent = 'Updating...'; msg.innerHTML = '';
  try {
    await api('/api/auth/reset-password', { method: 'POST', body: { email, otp, password } });
    show('done'); sub.textContent = 'Your password has been updated.';
  } catch (err) {
    msg.innerHTML = alertBox(err.message);
    if (/Incorrect|expired/.test(err.message)) { show('f-otp'); document.getElementById('otp').value = ''; }
  }
  btn.disabled = false; btn.textContent = 'Reset password →';
});
document.getElementById('back1').addEventListener('click', (e) => { e.preventDefault(); show('f-email'); sub.textContent = "We'll email you a 6-digit code to reset it."; });
document.getElementById('back2').addEventListener('click', (e) => { e.preventDefault(); show('f-otp'); });
document.getElementById('otp').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });
</script>
</body>
</html>
