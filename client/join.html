<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join | SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div id="sn-nav"></div>
<div class="container" style="max-width:480px">
  <div class="card" style="text-align:center">
    <h1>Join SproutNet.</h1>
    <p class="muted">Who are you joining as?</p>
  </div>
  <div class="card" id="rolepick">
    <div class="row" style="justify-content:center">
      <button class="btn" data-role="student">🎓 I'm a Student</button>
      <button class="btn" data-role="mentor">🧭 I want to Mentor</button>
      <button class="btn" data-role="poster">🏢 I have a Problem to Post</button>
    </div>
    <p class="muted" style="text-align:center">Student Phase 1: @jyothyit.ac.in only</p>
    <p class="muted" style="text-align:center">Already have an account? <a href="/login">Sign in</a></p>
  </div>
  <div class="card" id="formcard" style="display:none">
    <div id="msg"></div>
    <button class="btn" id="back" type="button">← Back</button>
    <h2 id="ftitle" style="margin-top:0.5rem"></h2>
    <form id="f">
      <label>Full name<input class="input" id="name" required placeholder="Arjun Verma"></label>
      <label id="emaillabel">Email address<input class="input" type="email" id="email" required></label>
      <label>Password (min 8 chars)<input class="input" type="password" id="password" required minlength="8"></label>
      <div id="studentfields" style="display:none">
        <label>Department<select class="select" id="dept">
          <option value="">Select department</option>
          <option>Computer Science</option><option>Information Science</option><option>AIML</option>
          <option>Electronics &amp; Communication</option><option>Electrical Engineering</option>
          <option>Mechanical Engineering</option><option>Civil Engineering</option>
          <option>Biotechnology</option><option>MBA</option><option>MCA</option><option>Other</option>
        </select></label>
        <label>Year<select class="select" id="year">
          <option value="">Select year</option>
          <option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option>
          <option>PG 1st Year</option><option>PG 2nd Year</option>
        </select></label>
      </div>
      <div id="posterfields" style="display:none">
        <label>City<input class="input" id="city" placeholder="Bangalore"></label>
        <label>Organisation type<select class="select" id="orgtype">
          <option value="">Select type</option>
          <option>Startup</option><option>NGO / Non-profit</option><option>Company</option>
          <option>Government Body</option><option>Research Institution</option><option>Individual</option><option>Other</option>
        </select></label>
      </div>
      <div id="mentorfields" style="display:none">
        <label>Bio<textarea class="textarea" id="bio" placeholder="Tell students about your expertise..."></textarea></label>
        <label>Skills (comma-separated)<input class="input" id="skills" placeholder="Web Development, System Design, AI/ML"></label>
        <label>Technologies (comma-separated)<input class="input" id="techs" placeholder="React, Python, PostgreSQL, AWS"></label>
        <label>Years of experience<input class="input" type="number" id="exp" min="0" max="50" placeholder="5"></label>
        <label>LinkedIn URL (optional)<input class="input" type="url" id="linkedin" placeholder="https://linkedin.com/in/yourprofile"></label>
        <label>GitHub URL (optional)<input class="input" type="url" id="github" placeholder="https://github.com/yourhandle"></label>
      </div>
      <button class="btn btn-primary" style="width:100%" type="submit" id="btn">Create account →</button>
    </form>
  </div>
</div>
<script src="/assets/config.js"></script>
<script type="module">
import { sb, api, renderNav, alertBox } from '/assets/app.js';
renderNav('login');
const qs = new URLSearchParams(location.search);
let role = qs.get('role') === 'poster' ? 'poster' : qs.get('role') === 'mentor' ? 'mentor' : qs.get('role') === 'student' ? 'student' : null;
const rolepick = document.getElementById('rolepick');
const formcard = document.getElementById('formcard');
const msg = document.getElementById('msg');

function showForm(r) {
  role = r;
  rolepick.style.display = 'none';
  formcard.style.display = '';
  document.getElementById('ftitle').textContent = r === 'student' ? 'Create Student Account' : r === 'mentor' ? 'Create Mentor Account' : 'Create Poster Account';
  document.getElementById('studentfields').style.display = r === 'student' ? '' : 'none';
  document.getElementById('posterfields').style.display = r === 'poster' ? '' : 'none';
  document.getElementById('mentorfields').style.display = r === 'mentor' ? '' : 'none';
  document.getElementById('emaillabel').firstChild.textContent = r === 'student' ? 'College email (@jyothyit.ac.in)' : 'Email address';
  document.getElementById('email').placeholder = r === 'student' ? 'you@jyothyit.ac.in' : 'you@company.com';
  document.getElementById('dept').required = r === 'student';
  document.getElementById('year').required = r === 'student';
  document.getElementById('city').required = r === 'poster';
  document.getElementById('orgtype').required = r === 'poster';
}
document.querySelectorAll('#rolepick [data-role]').forEach(b => b.addEventListener('click', () => showForm(b.dataset.role)));
document.getElementById('back').addEventListener('click', () => { role = null; formcard.style.display = 'none'; rolepick.style.display = ''; history.replaceState(null, '', '/join'); });
if (role) showForm(role);

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Creating account...'; msg.innerHTML = '';
  try {
    const supabase = sb();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (role === 'student') {
      const domain = '@' + email.split('@')[1];
      const { data: domainCheck } = await supabase.from('allowed_domains').select('domain').eq('domain', domain).eq('active', true).single();
      if (!domainCheck) throw new Error('Your college email is not yet registered on SproutNet. Phase 1 is open to @jyothyit.ac.in students only.');
    }
    const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { name, role } } });
    if (error) throw error;
    if (data.user) {
      const updates = { name, role };
      if (role === 'student') { updates.dept = document.getElementById('dept').value; updates.year = document.getElementById('year').value; }
      else if (role === 'poster') { updates.city = document.getElementById('city').value; updates.org_type = document.getElementById('orgtype').value; }
      await api('/api/auth/profile', { method: 'POST', body: updates });
      if (role === 'mentor') {
        const skills = document.getElementById('skills').value.split(',').map(s => s.trim()).filter(Boolean);
        const techs = document.getElementById('techs').value.split(',').map(t => t.trim()).filter(Boolean);
        await supabase.from('mentor_profiles').insert({
          user_id: data.user.id,
          bio: document.getElementById('bio').value || null,
          skills, technologies: techs,
          experience_years: parseInt(document.getElementById('exp').value) || 0,
          linkedin_url: document.getElementById('linkedin').value || null,
          github_url: document.getElementById('github').value || null,
        });
        location.href = '/mentor/dashboard';
      } else { location.href = '/dashboard'; }
      return;
    }
  } catch (err) { msg.innerHTML = alertBox(err.message); }
  btn.disabled = false; btn.textContent = 'Create account →';
});
</script>
</body>
</html>
