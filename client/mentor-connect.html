<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connection Request — SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  body { background: #FAF8F4; }
  .mc-wrap { max-width: 900px; margin: 0 auto; padding: clamp(24px, 5vw, 48px) clamp(16px, 4vw, 24px); }
  .mc-banner { background: #fff; border-radius: 14px; padding: 18px 24px; margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  .mc-banner.pending { border: 1.5px solid rgba(139,92,246,0.15); }
  .mc-banner.accepted { border: 1.5px solid rgba(45,106,79,0.2); }
  .mc-banner.declined { border: 1.5px solid rgba(220,38,38,0.15); }
  .mc-eyebrow { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
  .mc-eyebrow.purple { color: #8B5CF6; }
  .mc-eyebrow.green { color: #2D6A4F; }
  .mc-eyebrow.red { color: #DC2626; }
  .mc-sub { font-size: 14px; color: #4A3F38; margin-top: 4px; }
  .mc-btns { display: flex; gap: 10px; }
  .mc-accept { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: #fff; background: #2D6A4F; border: none; padding: 9px 22px; border-radius: 8px; cursor: pointer; }
  .mc-decline { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; color: #7A7068; background: #F1EFEA; border: none; padding: 9px 22px; border-radius: 8px; cursor: pointer; }
  .mc-accept:disabled, .mc-decline:disabled { cursor: not-allowed; opacity: 0.6; }
  .mc-chat { font-size: 14px; font-weight: 600; color: #fff; background: #2D6A4F; padding: 9px 18px; border-radius: 8px; text-decoration: none; }
  .mc-cols { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .mc-side { flex: 0 0 240px; display: flex; flex-direction: column; gap: 18px; }
  .mc-id { background: #fff; border-radius: 14px; border: 1.5px solid rgba(28,20,16,0.06); padding: 28px 20px; text-align: center; }
  .mc-id img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; }
  .mc-avatar { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; color: #fff; margin: 0 auto 12px; }
  .mc-id h1 { font-size: 18px; font-weight: 600; color: #1C1410; margin: 0; }
  .mc-tags { margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .mc-role { font-size: 11px; font-weight: 600; color: #2D6A4F; background: #EAF4EE; padding: 3px 10px; border-radius: 999px; text-transform: capitalize; }
  .mc-dept { font-size: 13px; color: #6B5E52; }
  .mc-score { background: #fff; border-radius: 14px; border: 1.5px solid rgba(28,20,16,0.06); padding: 18px; text-align: center; }
  .mc-score .n { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 600; color: #F4A723; line-height: 1.2; }
  .mc-score .l { font-size: 10px; color: #9CA3A0; margin-top: 2px; }
  .mc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
  .mc-card { background: #fff; border-radius: 14px; border: 1.5px solid rgba(28,20,16,0.06); padding: 20px; }
  .mc-card .lbl { font-size: 11px; font-weight: 600; color: #9CA3A0; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .mc-card p { font-size: 14px; color: #4A3F38; line-height: 1.7; margin: 0; }
  .mc-card p.quote { font-style: italic; background: #FAF8F4; padding: 12px 16px; border-radius: 8px; }
  .mc-links { display: flex; gap: 16px; flex-wrap: wrap; }
  .mc-links a { font-size: 13px; color: #4A3F38; text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .mc-full { font-size: 14px; font-weight: 600; color: #8B5CF6; background: rgba(139,92,246,0.08); padding: 10px 18px; border-radius: 8px; text-decoration: none; text-align: center; }
  .mc-back { font-size: 13px; font-weight: 600; color: #2D6A4F; background: #EAF4EE; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-block; margin-bottom: 16px; }
</style>
</head>
<body>
<div id="sn-nav"></div>
<main class="mc-wrap">
  <a class="mc-back" href="/mentor/dashboard">← Dashboard</a>
  <div id="msg"></div>
  <div id="banner"></div>
  <div id="profile" role="status" aria-label="Loading profile"><span class="sr-only">Loading…</span><div class="mc-cols" aria-hidden="true">
    <div class="mc-side"><div class="mc-id"><div class="sk sk-circle" style="width:96px;height:96px;margin:0 auto 12px"></div><div class="sk" style="height:20px;width:70%;margin:0 auto 10px"></div><div class="sk sk-line" style="width:50%;margin:0 auto"></div></div><div class="mc-score"><div class="sk" style="height:32px;width:50%;margin:0 auto"></div></div></div>
    <div class="mc-main"><div class="mc-card"><div class="sk sk-line" style="width:30%;margin-bottom:10px"></div><div class="sk sk-line" style="width:100%"></div><div class="sk sk-line" style="width:90%"></div></div><div class="mc-card"><div class="sk sk-line" style="width:25%;margin-bottom:10px"></div><div class="sk sk-line" style="width:100%"></div></div></div>
  </div></div>
</main>
<script src="/assets/config.js"></script>
<script type="module">
import { api, requireRole, renderNav, esc, alertBox } from '/assets/app.js';
renderNav();
const me = await requireRole('mentor', 'admin');
const msg = document.getElementById('msg');
const nid = location.pathname.split('/')[3];
const AVATAR_COLORS = ['#2D6A4F', '#1E40AF', '#9C6344', '#6B4C2A', '#3D8A65', '#4A3F38', '#7C3AED', '#BE123C'];
const avatarColor = (n) => AVATAR_COLORS[(n || '?').charCodeAt(0) % AVATAR_COLORS.length];
const initialsOf = (n) => String(n || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
if (me) {
  if (!nid) location.href = '/mentor/dashboard';
  else {
    try {
      const { notification, student, message, isPending } = await api(`/api/mentor/connect/${nid}`);
      const resp = notification.metadata?.response;
      document.getElementById('banner').innerHTML = isPending
        ? `<div class="mc-banner pending"><div><div class="mc-eyebrow purple">Pending Connection Request</div><div class="mc-sub">This student has requested mentorship from you.</div></div>
           <div class="mc-btns"><button type="button" class="mc-accept" data-act="accept">Accept</button><button type="button" class="mc-decline" data-act="decline">Decline</button></div></div>`
        : `<div class="mc-banner ${resp === 'accepted' ? 'accepted' : 'declined'}"><div><div class="mc-eyebrow ${resp === 'accepted' ? 'green' : 'red'}">Request ${resp === 'accepted' ? 'Accepted' : 'Declined'}</div></div>
           ${resp === 'accepted' ? `<a class="mc-chat" href="/messages?user=${esc(student.id)}">Start Chat →</a>` : ''}</div>`;
      const links = [];
      if (student.github) links.push(`<a href="${esc(student.github)}" target="_blank" rel="noreferrer"><span style="font-size:15px">⌨</span> GitHub</a>`);
      if (student.linkedin) links.push(`<a href="${esc(student.linkedin)}" target="_blank" rel="noreferrer"><span style="font-size:15px">🔗</span> LinkedIn</a>`);
      if (student.twitter) links.push(`<a href="${esc(student.twitter)}" target="_blank" rel="noreferrer"><span style="font-size:15px">𝕏</span> Twitter</a>`);
      document.getElementById('profile').innerHTML = `<div class="mc-cols">
        <div class="mc-side">
          <div class="mc-id">
            ${student.avatar_url ? `<img src="${esc(student.avatar_url)}" alt="${esc(student.name)}" loading="eager" fetchpriority="high" decoding="async">`
              : `<div class="mc-avatar" style="background:${avatarColor(student.name)}">${esc(initialsOf(student.name))}</div>`}
            <h1>${esc(student.name)}</h1>
            <div class="mc-tags"><span class="mc-role">${esc(student.role || 'student')}</span><span class="mc-dept">${esc([student.dept, student.year].filter(Boolean).join(' · '))}</span></div>
          </div>
          <div class="mc-score"><div class="n">${student.builder_score ?? 0}</div><div class="l">Builder Score</div></div>
        </div>
        <div class="mc-main">
          ${message ? `<div class="mc-card"><div class="lbl">Message</div><p class="quote">&ldquo;${esc(message)}&rdquo;</p></div>` : ''}
          ${student.bio ? `<div class="mc-card"><div class="lbl">About</div><p>${esc(student.bio)}</p></div>` : ''}
          ${links.length ? `<div class="mc-card"><div class="lbl">Connect</div><div class="mc-links">${links.join('')}</div></div>` : ''}
          ${student.profile_slug ? `<a class="mc-full" href="/profile/${esc(student.profile_slug)}">View Full Public Profile →</a>` : ''}
        </div>
      </div>`;
      document.getElementById('banner').addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-act]');
        if (!btn) return;
        btn.disabled = true;
        try {
          await api('/api/mentors/respond-connect', { method: 'POST', body: { notificationId: nid, action: btn.dataset.act } });
          location.reload();
        } catch (err) { msg.innerHTML = alertBox(err.message); btn.disabled = false; }
      });
    } catch (e) { msg.innerHTML = alertBox(e.message); }
  }
}
</script>
</body>
</html>
