<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentor Dashboard — SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  body { background: #FAF8F4; }
  .md-wrap { max-width: 1100px; margin: 0 auto; padding: clamp(32px, 6vw, 52px) clamp(16px, 4vw, 24px); }
  .md-welcome { margin-bottom: 36px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; }
  .md-welcome h1 { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(30px, 6vw, 42px); font-weight: 400; color: #1C1410; letter-spacing: -0.5px; margin: 0 0 6px; }
  .md-welcome p { font-size: 15px; color: #7A7068; font-weight: 400; margin: 0; }
  .md-edit { font-size: 14px; font-weight: 600; color: #2D6A4F; background: #EAF4EE; border: 1px solid rgba(45,106,79,0.2); padding: 10px 18px; border-radius: 8px; text-decoration: none; }
  .md-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 40px; }
  .md-stat { background: #fff; border: 1.5px solid rgba(28,20,16,0.07); border-radius: 12px; padding: 22px 20px; }
  .md-stat .lbl { font-size: 11px; color: #9CA3A0; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .md-stat .row { display: flex; align-items: baseline; gap: 4px; }
  .md-stat .num { font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 500; }
  .md-stat .sub { font-size: 14px; color: #9CA3A0; }
  .md-stat .avail { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 500; text-transform: capitalize; }
  .md-quick { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 44px; }
  .md-quick a { font-size: 14px; font-weight: 600; padding: 10px 22px; border-radius: 10px; text-decoration: none; }
  .md-quick .q1 { color: #8B5CF6; background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.2); }
  .md-quick .q2 { color: #2D6A4F; background: #fff; border: 1px solid rgba(45,106,79,0.2); }
  .md-quick .q3 { color: #1C1410; background: #F4A723; border: none; }
  .md-sec { margin-bottom: 44px; }
  .md-sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .md-sec-head h2 { font-family: Sora, sans-serif; font-size: 19px; font-weight: 700; color: #1C1410; margin: 0; }
  .md-count { margin-left: 10px; font-size: 12px; padding: 2px 8px; border-radius: 20px; }
  .md-count.amber { background: #F4A723; color: #1C1410; }
  .md-count.purple { background: #8B5CF6; color: #fff; }
  .md-count.green { background: #2D6A4F; color: #fff; }
  .md-empty { background: #fff; border: 1.5px solid rgba(28,20,16,0.07); border-radius: 14px; padding: 36px 28px; text-align: center; }
  .md-empty .big { font-size: 28px; margin-bottom: 8px; }
  .md-empty .t { font-size: 15px; color: #7A7068; }
  .md-empty .d { font-size: 13px; color: #9CA3A0; margin-top: 4px; }
  .md-req { background: #fff; border: 1.5px solid rgba(28,20,16,0.08); border-radius: 14px; padding: 22px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  .md-req .body { flex: 1; min-width: 200px; }
  .md-eyebrow { font-size: 12px; color: #2D6A4F; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .md-eyebrow.purple { color: #8B5CF6; font-size: 13px; }
  .md-team { font-family: Sora, sans-serif; font-size: 17px; font-weight: 700; color: #1C1410; }
  .md-prob { font-size: 14px; color: #4A3F38; margin-top: 2px; }
  .md-quote { font-size: 13px; color: #7A7068; font-style: italic; margin-top: 8px; background: #FAF8F4; padding: 8px 12px; border-radius: 8px; }
  .md-by { font-size: 12px; color: #9CA3A0; margin-top: 8px; }
  .md-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .md-accept { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: #fff; background: #2D6A4F; border: none; padding: 9px 18px; border-radius: 8px; cursor: pointer; }
  .md-decline { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: #7A7068; background: #F1EFEA; border: none; padding: 9px 18px; border-radius: 8px; cursor: pointer; }
  .md-accept:disabled, .md-decline:disabled { cursor: not-allowed; opacity: 0.6; }
  .md-conn { background: #fff; border: 1.5px solid rgba(139,92,246,0.15); border-radius: 14px; padding: 22px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  .md-conn .from { font-family: Sora, sans-serif; font-size: 18px; font-weight: 700; color: #1C1410; margin-top: 4px; }
  .md-view { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: #8B5CF6; background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.2); padding: 9px 18px; border-radius: 8px; text-decoration: none; }
  .md-chat { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: #1C1410; background: #F4A723; border: none; padding: 9px 18px; border-radius: 8px; text-decoration: none; }
  .md-done { background: #FAF8F4; border: 1.5px solid rgba(28,20,16,0.06); border-radius: 12px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .md-hist { background: #fff; border: 1.5px solid rgba(28,20,16,0.06); border-radius: 10px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .md-hist .who { display: flex; align-items: center; gap: 10px; }
  .md-hist .nm { font-size: 14px; font-weight: 600; color: #1C1410; }
  .md-pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; text-transform: capitalize; }
  .md-pill.ok { background: #EAF4EE; color: #2D6A4F; }
  .md-pill.no { background: #FEE2E2; color: #DC2626; }
  .md-msg { font-size: 13px; color: #2D6A4F; text-decoration: none; font-weight: 500; }
  .md-hist-title { font-family: Sora, sans-serif; font-size: 15px; font-weight: 600; color: #7A7068; margin-bottom: 12px; }
  .md-teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .md-team-card { background: #fff; border: 1.5px solid rgba(28,20,16,0.08); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .md-team-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .md-team-dom { font-size: 11px; color: #2D6A4F; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
  .md-team-st { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #EAF4EE; color: #2D6A4F; text-transform: capitalize; }
  .md-team-nm { font-family: Sora, sans-serif; font-size: 17px; font-weight: 700; color: #1C1410; margin-bottom: 4px; }
  .md-team-p { font-size: 13px; color: #7A7068; margin-bottom: 16px; flex: 1; }
  .md-open { align-self: flex-start; font-size: 13px; font-weight: 600; color: #1C1410; background: #F4A723; padding: 8px 16px; border-radius: 8px; text-decoration: none; }
  .md-grid { display: grid; gap: 14px; }
</style>
</head>
<body>
<div id="sn-nav"></div>
<main class="md-wrap">
  <div id="msg"></div>
  <div class="md-welcome">
    <div><h1 id="welcome">Welcome, Mentor.</h1><p>Guide student teams, review requests, and foster engineering impact.</p></div>
    <a class="md-edit" href="/mentor/profile">Edit Profile &amp; Availability →</a>
  </div>
  <div class="md-stats" id="stats"></div>
  <div class="md-quick">
    <a class="q1" href="/mentors">Browse Mentors →</a>
    <a class="q2" href="/messages">Open Messages →</a>
    <a class="q3" href="/notifications">View Notifications →</a>
  </div>
  <div class="md-sec">
    <div class="md-sec-head"><h2>Team Mentorship Requests <span class="md-count amber" id="req-count" style="display:none"></span></h2></div>
    <div id="requests"><p style="font-size:14px;color:#9CA3A0">Loading…</p></div>
  </div>
  <div class="md-sec">
    <div class="md-sec-head"><h2>Individual Connections <span class="md-count purple" id="conn-count" style="display:none"></span></h2></div>
    <div id="connections"></div>
    <div id="history" style="margin-top:24px"></div>
  </div>
  <div>
    <div class="md-sec-head"><h2>My Teams</h2></div>
    <div id="teams"></div>
  </div>
</main>
<script src="/assets/config.js"></script>
<script type="module">
import { api, requireRole, renderNav, esc, alertBox } from '/assets/app.js';
renderNav();
const me = await requireRole('mentor', 'admin');
const msg = document.getElementById('msg');
async function respondConnect(notificationId, action, btn) {
  btn.disabled = true;
  try {
    await api('/api/mentors/respond-connect', { method: 'POST', body: { notificationId, action } });
    await load();
  } catch (e) { msg.innerHTML = alertBox(e.message); btn.disabled = false; }
}
async function respondTeam(requestId, action, btn) {
  btn.disabled = true;
  try {
    await api('/api/mentors/request', { method: 'POST', body: { requestId, action } });
    await load();
  } catch (e) { msg.innerHTML = alertBox(e.message); btn.disabled = false; }
}
async function load() {
  try {
    const d = await api('/api/mentor/dashboard');
    document.getElementById('welcome').textContent = `Welcome, Mentor ${(d.profile.name || '').split(' ')[0]}.`;
    const pending = d.connections.filter(c => !c.metadata?.response);
    const done = d.connections.filter(c => c.metadata?.response);
    const hasRequests = (d.requests.length + pending.length) > 0;
    const avail = d.mentorProfile?.availability_status || '';
    document.getElementById('stats').innerHTML = `
      <div class="md-stat"><div class="lbl">Active Teams</div><div class="row"><span class="num" style="color:#2D6A4F">${d.assignments.length}</span><span class="sub">/ ${d.mentorProfile?.max_active_teams ?? 3}</span></div></div>
      <div class="md-stat"><div class="lbl">Pending</div><div class="row"><span class="num" style="color:${hasRequests ? '#F4A723' : '#9CA3A0'}">${d.requests.length + pending.length}</span></div></div>
      <div class="md-stat"><div class="lbl">Availability</div><div class="row"><span class="avail" style="color:${avail === 'available' ? '#2D6A4F' : '#7A7068'}">${esc(avail || 'Set status →')}</span></div></div>
      <div class="md-stat"><div class="lbl">Students Connected</div><div class="row"><span class="num" style="color:#1C1410">${done.length + (d.mentorProfile?.students_connected || 0)}</span></div></div>`;
    const rc = document.getElementById('req-count');
    if (d.requests.length) { rc.style.display = ''; rc.textContent = d.requests.length; } else { rc.style.display = 'none'; }
    document.getElementById('requests').innerHTML = d.requests.length ? `<div class="md-grid">` + d.requests.map(r => `<div class="md-req">
      <div class="body">
        <div class="md-eyebrow">${esc(r.teams?.problems?.domain || 'Problem')}</div>
        <div class="md-team">${esc(r.teams?.name)}</div><div class="md-prob">${esc(r.teams?.problems?.title || '')}</div>
        ${r.message ? `<div class="md-quote">&ldquo;${esc(r.message)}&rdquo;</div>` : ''}
        <div class="md-by">Requested by <strong>${esc(r.users?.name || r.users?.email || 'Unknown')}</strong></div>
      </div>
      <div class="md-btns"><button type="button" class="md-accept" data-req="${esc(r.id)}" data-act="accept">Accept ✓</button>
      <button type="button" class="md-decline" data-req="${esc(r.id)}" data-act="reject">Decline</button></div>
    </div>`).join('') + `</div>` : `<div class="md-empty"><div class="big">📭</div><div class="t">No pending team mentorship requests.</div><div class="d">Teams will appear here when students request your mentorship.</div></div>`;
    const cc = document.getElementById('conn-count');
    if (pending.length) { cc.style.display = ''; cc.textContent = pending.length; } else { cc.style.display = 'none'; }
    document.getElementById('connections').innerHTML = d.connections.length
      ? (pending.length ? `<div class="md-grid">` + pending.map(c => `<div class="md-conn">
          <div><div class="md-eyebrow purple">Individual Connection</div>
          <div class="from">From: ${esc(c.metadata?.student_name || 'A student')}</div>
          ${c.metadata?.message ? `<div class="md-quote">&ldquo;${esc(c.metadata.message)}&rdquo;</div>` : ''}</div>
          <div class="md-btns"><a class="md-view" href="/mentor/connect/${esc(c.id)}">View Profile →</a>
          <button type="button" class="md-accept" data-conn="${esc(c.id)}" data-act="accept">Accept</button>
          <button type="button" class="md-decline" data-conn="${esc(c.id)}" data-act="decline">Decline</button>
          ${c.metadata?.student_id ? `<a class="md-chat" href="/messages?user=${esc(c.metadata.student_id)}">Start Chat →</a>` : ''}</div>
        </div>`).join('') + `</div>` : `<div class="md-empty"><div class="t" style="font-size:14px">All requests processed. Showing history below.</div></div>`)
      : `<div class="md-empty"><div class="big">🤝</div><div class="t">No connection requests yet.</div><div class="d">Students can send individual connection requests from the mentor directory.</div></div>`;
    document.getElementById('history').innerHTML = done.length ? `<div class="md-hist-title">History (${done.length})</div><div class="md-grid">` + done.map(c => {
      const r = c.metadata?.response;
      return `<div class="md-hist"><div class="who"><span style="font-size:13px;color:${r === 'accepted' ? '#2D6A4F' : '#DC2626'}">${r === 'accepted' ? '✓' : '✕'}</span> <span class="nm">${esc(c.metadata?.student_name || 'Student')}</span> <span class="md-pill ${r === 'accepted' ? 'ok' : 'no'}">${esc(r)}</span></div>
      ${c.metadata?.student_id ? `<a class="md-msg" href="/messages?user=${esc(c.metadata.student_id)}">Message →</a>` : ''}</div>`;
    }).join('') + `</div>` : '';
    document.getElementById('teams').innerHTML = d.assignments.length ? `<div class="md-teams">` + d.assignments.map(a => `<div class="md-team-card">
      <div class="md-team-top"><span class="md-team-dom">${esc(a.teams?.problems?.domain || 'General')}</span><span class="md-team-st">${esc(a.teams?.status || 'active')}</span></div>
      <div class="md-team-nm">${esc(a.teams?.name)}</div><div class="md-team-p">${esc(a.teams?.problems?.title || '')}</div>
      <a class="md-open" href="/teams/${esc(a.team_id)}">Open Workspace →</a></div>`).join('') + `</div>`
      : `<div class="md-empty"><div class="big">👥</div><div class="t">No teams assigned yet.</div><div class="d">Once you accept a mentorship request, the team will appear here with a full workspace.</div></div>`;
  } catch (e) { msg.innerHTML = alertBox(e.message); }
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('button[data-req]');
  if (t) respondTeam(t.dataset.req, t.dataset.act, t);
  const c = e.target.closest('button[data-conn]');
  if (c) respondConnect(c.dataset.conn, c.dataset.act, c);
});
if (me) load();
</script>
</body>
</html>
