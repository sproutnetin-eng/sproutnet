<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentor Profile — SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  body { background: #FAF8F4; }
  .mp-nav { padding: 12px clamp(16px, 4vw, 52px); display: flex; justify-content: space-between; align-items: center; background: rgba(250,248,244,0.94); border-bottom: 1px solid rgba(28,20,16,0.07); }
  .mp-nav a { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1C1410; font-weight: 600; font-size: 14px; }
  .mp-nav span { font-size: 14px; color: #4A3F38; }
  .mp-wrap { max-width: 720px; margin: 40px auto; padding: 0 20px; }
  .mp-wrap h1 { font-family: 'Instrument Serif', Georgia, serif; font-size: 36px; font-weight: 400; color: #1C1410; margin: 0 0 8px; }
  .mp-wrap .sub { font-size: 15px; color: #4A3F38; margin: 0 0 32px; }
  .mp-form { background: #fff; border: 1.5px solid rgba(28,20,16,0.08); border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 20px; }
  .mp-field { display: flex; flex-direction: column; gap: 6px; }
  .mp-field > span { font-size: 13px; font-weight: 600; color: #1C1410; }
  .mp-field > span.small { font-size: 12px; font-weight: 500; color: #4A3F38; }
  .mp-input { font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1C1410; background: #FAF8F4; border: 1.5px solid rgba(28,20,16,0.12); border-radius: 8px; padding: 11px 14px; outline: none; width: 100%; box-sizing: border-box; }
  .mp-input.sm { font-size: 13px; border-width: 1px; border-radius: 6px; padding: 8px 10px; }
  .mp-textarea { font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1C1410; background: #FAF8F4; border: 1.5px solid rgba(28,20,16,0.12); border-radius: 8px; padding: 11px 14px; outline: none; width: 100%; box-sizing: border-box; resize: vertical; }
  .mp-2col { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .mp-3col { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .mp-save { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; color: #1C1410; background: #F4A723; border: none; border-radius: 8px; padding: 12px; cursor: pointer; margin-top: 8px; width: 100%; }
  .mp-save:disabled { cursor: not-allowed; opacity: 0.7; }
</style>
</head>
<body>
<div id="sn-nav"></div>
<nav class="mp-nav">
  <a href="/mentor/dashboard">← Back to Mentor Dashboard</a>
  <span id="who"></span>
</nav>
<main class="mp-wrap">
  <h1>Mentor Profile &amp; Availability</h1>
  <p class="sub">Manage your technology expertise, social profiles, and team capacity.</p>
  <div id="msg"></div>
  <form id="f" class="mp-form" style="display:none">
    <label class="mp-field"><span>Bio &amp; Background</span><textarea class="mp-textarea" name="bio" id="bio" rows="4" placeholder="Tell students about your engineering domain expertise..."></textarea></label>
    <div class="mp-2col">
      <label class="mp-field"><span>Primary Skills (comma-separated)</span><input class="mp-input" name="skills" id="skills" placeholder="System Architecture, Machine Learning, UI/UX"></label>
      <label class="mp-field"><span>Technologies (comma-separated)</span><input class="mp-input" name="technologies" id="tech" placeholder="Next.js, Python, PostgreSQL, PyTorch"></label>
    </div>
    <div class="mp-2col">
      <label class="mp-field"><span>Availability Status</span><select class="mp-input" name="availability_status" id="avail">
        <option value="available">Available for new teams</option><option value="busy">Busy (Limited capacity)</option><option value="unavailable">Unavailable</option>
      </select></label>
      <label class="mp-field"><span>Max Active Teams</span><input class="mp-input" type="number" min="1" max="10" name="max_active_teams" id="maxteams"></label>
    </div>
    <div class="mp-3col">
      <label class="mp-field"><span class="small">LinkedIn URL</span><input class="mp-input sm" name="linkedin_url" id="li" placeholder="https://linkedin.com/in/..."></label>
      <label class="mp-field"><span class="small">GitHub URL</span><input class="mp-input sm" name="github_url" id="gh" placeholder="https://github.com/..."></label>
      <label class="mp-field"><span class="small">Portfolio URL</span><input class="mp-input sm" name="portfolio_url" id="pf" placeholder="https://yourportfolio.com"></label>
    </div>
    <button class="mp-save" id="save" type="submit">Save Profile &amp; Availability Settings →</button>
  </form>
</main>
<script src="/assets/config.js"></script>
<script type="module">
import { api, requireRole, renderNav, alertBox } from '/assets/app.js';
renderNav();
const me = await requireRole('mentor', 'admin');
const msg = document.getElementById('msg');
const f = document.getElementById('f');
if (me) {
  if (me.profile?.name) document.getElementById('who').textContent = me.profile.name;
  try {
    const { mentorProfile: mp } = await api('/api/mentor/profile-data');
    document.getElementById('bio').value = mp?.bio || '';
    document.getElementById('skills').value = Array.isArray(mp?.skills) ? mp.skills.join(', ') : (mp?.skills || '');
    document.getElementById('tech').value = Array.isArray(mp?.technologies) ? mp.technologies.join(', ') : (mp?.technologies || '');
    document.getElementById('avail').value = mp?.availability_status || 'available';
    document.getElementById('maxteams').value = mp?.max_active_teams ?? 3;
    document.getElementById('li').value = mp?.linkedin_url || '';
    document.getElementById('gh').value = mp?.github_url || '';
    document.getElementById('pf').value = mp?.portfolio_url || '';
    f.style.display = '';
  } catch (e) { msg.innerHTML = alertBox(e.message); }
}
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('save');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const fd = new FormData(f);
    await api('/api/mentors/profile', { method: 'POST', body: {
      bio: fd.get('bio'), skills: fd.get('skills'), technologies: fd.get('technologies'),
      availability_status: fd.get('availability_status'), max_active_teams: Number(fd.get('max_active_teams')) || 3,
      linkedin_url: fd.get('linkedin_url'), github_url: fd.get('github_url'), portfolio_url: fd.get('portfolio_url'),
    }});
    msg.innerHTML = alertBox('Profile saved.', true);
  } catch (err) { msg.innerHTML = alertBox(err.message); }
  btn.disabled = false; btn.textContent = 'Save Profile & Availability Settings →';
});
</script>
</body>
</html>
