<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div id="sn-nav"></div>
<div class="container" style="max-width:720px">
  <div id="msg"></div>
  <h1>Notifications</h1>
  <p class="muted">Stay updated on mentor acceptances, team requests, and workspace updates.</p>
  <div id="content"><p class="muted">Loading...</p></div>
</div>
<script src="/assets/config.js"></script>
<script type="module">
import { api, esc, requireAuth, renderNav, alertBox } from '/assets/app.js';
renderNav('dash');
const msg = document.getElementById('msg');
const content = document.getElementById('content');

const s = await requireAuth();
if (s) {
  try {
    const { notifications } = await api('/api/student/notifications');
    content.innerHTML = notifications.length ? notifications.map(n => `
      <div class="card row" style="justify-content:space-between">
        <div>
          <div class="badge">${esc(n.event_type || '')}</div>
          <h3 style="margin:0.25rem 0">${esc(n.title || '')}</h3>
          <p class="muted">${esc(n.body || '')}</p>
          <div class="muted" style="font-size:0.8rem">${n.created_at ? new Date(n.created_at).toLocaleString() : ''}</div>
        </div>
        ${n.link_url ? `<a class="btn btn-primary" href="${esc(n.link_url)}">View →</a>` : ''}
      </div>`).join('')
      : '<div class="card" style="text-align:center;color:var(--muted)">You have no notifications yet.</div>';
  } catch (err) { msg.innerHTML = alertBox(err.message); content.innerHTML = ''; }
}
</script>
</body>
</html>
