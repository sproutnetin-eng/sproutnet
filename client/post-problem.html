<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Problem — SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .pp-wrap { max-width: 980px; margin: 0 auto; padding: clamp(32px, 6vw, 52px) clamp(16px, 4vw, 24px); }
  .pp-head { margin-bottom: 32px; }
  .pp-head h1 { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(30px, 6vw, 42px); font-weight: 400; color: #1C1410; letter-spacing: -0.5px; margin: 0 0 8px; }
  .pp-head p { font-size: 16px; color: #4A3F38; font-weight: 300; margin: 0; }
  .pp-form { background: #fff; border: 1.5px solid rgba(28,20,16,0.07); border-radius: 14px; padding: clamp(22px, 3vw, 32px); display: grid; gap: 18px; }
  .pp-err { background: rgba(220,38,38,0.06); border: 1px solid rgba(220,38,38,0.2); border-radius: 8px; padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: #DC2626; }
  .pp-ok { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); border-radius: 8px; padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: #16A34A; }
  .pp-field { display: flex; flex-direction: column; gap: 6px; }
  .pp-field > span { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: #1C1410; }
  .pp-input { font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1C1410; background: #FAF8F4; border: 1.5px solid rgba(28,20,16,0.12); border-radius: 8px; padding: 11px 14px; outline: none; width: 100%; box-sizing: border-box; }
  .pp-textarea { font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1C1410; background: #FAF8F4; border: 1.5px solid rgba(28,20,16,0.12); border-radius: 8px; padding: 11px 14px; outline: none; width: 100%; box-sizing: border-box; resize: vertical; }
  .pp-2col { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .pp-2col-sm { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .pp-hint { font-size: 12px; color: #6A5F58; }
  .pp-team-note { font-size: 12px; color: #7A7068; margin-top: 6px; line-height: 1.5; }
  .pp-check { display: flex; align-items: center; gap: 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1C1410; }
  .pp-check input { width: 18px; height: 18px; accent-color: #2D6A4F; }
  .pp-thumb { border: 1.5px solid rgba(28,20,16,0.08); border-radius: 12px; overflow: hidden; background: #FAF8F4; }
  .pp-thumb .prev { aspect-ratio: 16 / 9; background: #F3EEE7; }
  .pp-thumb .prev img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pp-thumb .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; flex-wrap: wrap; }
  .pp-thumb .bar span { font-size: 12px; color: #4A3F38; }
  .pp-remove { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; color: #1C1410; background: #fff; border: 1px solid rgba(28,20,16,0.12); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .pp-actions { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; row-gap: 10px; }
  .pp-cancel { font-family: 'DM Sans', sans-serif; font-size: 14px; color: #4A3F38; text-decoration: none; padding: 12px 18px; border-radius: 8px; border: 1px solid rgba(28,20,16,0.12); }
  .pp-submit { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: #1C1410; background: #F4A723; border: none; border-radius: 8px; padding: 12px 22px; cursor: pointer; box-shadow: 0 2px 10px rgba(244,167,35,0.3); }
  .pp-submit:disabled { cursor: not-allowed; }
  .pp-popup { position: fixed; inset: 0; background: rgba(28,20,16,0.35); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .pp-popup .box { width: min(420px, 92vw); background: #fff; border-radius: 16px; padding: 28px 26px; border: 1.5px solid rgba(28,20,16,0.08); box-shadow: 0 20px 60px rgba(28,20,16,0.2); }
  .pp-popup .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #2D6A4F; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
  .pp-popup .big { font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; color: #1C1410; margin-bottom: 10px; }
  .pp-popup p { font-size: 14px; color: #4A3F38; font-weight: 300; margin: 0 0 18px; }
  .pp-popup button { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: #1C1410; background: #F4A723; border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; box-shadow: 0 2px 10px rgba(244,167,35,0.3); }
</style>
</head>
<body>
<div id="sn-nav"></div>
<main class="pp-wrap">
  <div id="popup"></div>
  <div class="pp-head">
    <h1>Post a problem</h1>
    <p>Give students enough context to build serious, structured solutions.</p>
  </div>
  <div id="msg"></div>
  <form id="f" class="pp-form">
    <div id="form-msg"></div>
    <label class="pp-field"><span>Problem title</span><input class="pp-input" name="title" required placeholder="Short, descriptive title"></label>
    <label class="pp-field"><span>Thumbnail image (optional)</span>
      <div style="display:grid;gap:12px">
        <input class="pp-input" type="file" id="thumb" accept="image/jpeg,image/png,image/webp,image/gif">
        <div class="pp-hint">Add a JPG, PNG, WebP, or GIF image up to 5 MB for the problem preview card.</div>
        <div id="thumb-preview"></div>
      </div>
    </label>
    <div class="pp-2col">
      <label class="pp-field"><span>Domain</span><select class="pp-input" name="domain">
        <option>AI &amp; Data</option><option>Climate</option><option>Public Infrastructure</option>
        <option>Healthcare</option><option>Agriculture</option><option>Education</option>
        <option>Urban Mobility</option><option>Civic Technology</option>
      </select></label>
      <label class="pp-field"><span>Problem type</span><select class="pp-input" name="problem_type" id="ptype">
        <option value="public_impact">Public Impact</option><option value="industry_challenge">Industry Challenge</option>
      </select></label>
    </div>
    <div>
      <label class="pp-field"><span>Participation Type</span><select class="pp-input" name="team_mode" id="tmode">
        <option value="solo">Individual Only</option><option value="team">Team Only</option><option value="both">Both Individual &amp; Team</option>
      </select></label>
      <div class="pp-team-note" id="team-note" style="display:none">For teams: The leader signs up first and receives a unique <strong>team invite code</strong>. Other members join by entering this code. Team size can be 2-10 members.</div>
    </div>
    <div class="pp-2col-sm" id="team-sizes" style="display:none">
      <label class="pp-field"><span>Min Team Size</span><input class="pp-input" type="number" min="2" max="10" name="min_team_size" value="2"></label>
      <label class="pp-field"><span>Max Team Size</span><input class="pp-input" type="number" min="2" max="10" name="max_team_size" value="4"></label>
    </div>
    <div class="pp-2col-sm">
      <label class="pp-check"><input type="checkbox" name="mentor_required" id="mentor-req"> Require Mentor Guidance for this Problem</label>
      <label class="pp-field" id="max-mentors-wrap" style="display:none"><span>Max Mentors Per Team</span><input class="pp-input" type="number" min="1" max="3" name="max_mentors_per_team" value="1"></label>
    </div>
    <div id="reward-wrap" style="display:none"><label class="pp-field"><span>Reward amount (INR)</span><input class="pp-input" type="number" min="0" name="reward_amount" placeholder="50000"></label></div>
    <div class="pp-2col-sm">
      <label class="pp-field"><span>Submission deadline</span><input class="pp-input" type="date" name="deadline" required></label>
      <label class="pp-field"><span>Judging deadline</span><input class="pp-input" type="date" name="judging_deadline" required></label>
    </div>
    <label class="pp-field"><span>Background &amp; context</span><textarea class="pp-textarea" name="context" required rows="4" placeholder="Why this problem matters, who is affected, and what has been tried."></textarea></label>
    <label class="pp-field"><span>Problem statement</span><textarea class="pp-textarea" name="problem_stmt" required rows="4" placeholder="Describe the exact problem to be solved."></textarea></label>
    <label class="pp-field"><span>Scope</span><textarea class="pp-textarea" name="scope" required rows="3" placeholder="What is in scope and what is out of scope?"></textarea></label>
    <label class="pp-field"><span>Constraints</span><textarea class="pp-textarea" name="constraints" required rows="3" placeholder="Budget, policy, infrastructure, or operational constraints."></textarea></label>
    <label class="pp-field"><span>Deliverables</span><textarea class="pp-textarea" name="deliverables" required rows="3" placeholder="Expected outputs, format, or artifacts."></textarea></label>
    <div class="pp-actions">
      <a class="pp-cancel" href="/poster/dashboard">Cancel</a>
      <button class="pp-submit" id="submit" type="submit">Submit for review</button>
    </div>
  </form>
</main>
<script src="/assets/config.js"></script>
<script type="module">
import { api, requireRole, renderNav, esc, alertBox } from '/assets/app.js';
renderNav();
const me = await requireRole('poster', 'admin');
if (!me) throw new Error('blocked');
const msg = document.getElementById('msg');
const formMsg = document.getElementById('form-msg');
const f = document.getElementById('f');
const thumb = document.getElementById('thumb');
function showPopup() {
  document.getElementById('popup').innerHTML = `<div class="pp-popup"><div class="box">
    <div class="big">Problem posted.</div>
    <p>Your problem is now live in the problems list. Redirecting to your dashboard.</p>
    <button type="button" id="popup-ok">Okay</button></div></div>`;
  document.getElementById('popup-ok').addEventListener('click', () => { document.getElementById('popup').innerHTML = ''; });
}
document.getElementById('ptype').addEventListener('change', (e) => {
  document.getElementById('reward-wrap').style.display = e.target.value === 'industry_challenge' ? '' : 'none';
});
document.getElementById('tmode').addEventListener('change', (e) => {
  const team = e.target.value !== 'solo';
  document.getElementById('team-sizes').style.display = team ? '' : 'none';
  document.getElementById('team-note').style.display = team ? '' : 'none';
});
document.getElementById('mentor-req').addEventListener('change', (e) => {
  document.getElementById('max-mentors-wrap').style.display = e.target.checked ? '' : 'none';
});
thumb.addEventListener('change', () => {
  const file = thumb.files[0];
  const prev = document.getElementById('thumb-preview');
  if (!file) { prev.innerHTML = ''; return; }
  if (file.size > 5 * 1024 * 1024) { formMsg.innerHTML = `<div class="pp-err">Thumbnail must be 5 MB or smaller.</div>`; thumb.value = ''; prev.innerHTML = ''; return; }
  const url = URL.createObjectURL(file);
  prev.innerHTML = `<div class="pp-thumb"><div class="prev"><img src="${url}" alt="Problem thumbnail preview" loading="eager" decoding="async"></div><div class="bar"><span>${esc(file.name)}</span><button type="button" class="pp-remove" id="thumb-clear">Remove image</button></div></div>`;
  document.getElementById('thumb-clear').addEventListener('click', () => { thumb.value = ''; prev.innerHTML = ''; });
});
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const fd = new FormData(f);
    if (fd.get('judging_deadline') && fd.get('deadline') && fd.get('judging_deadline') < fd.get('deadline')) {
      throw new Error('Judging deadline must be on or after the submission deadline.');
    }
    let thumbnail_url = null;
    if (thumb.files[0]) {
      btn.textContent = 'Uploading image…';
      const up = new FormData();
      up.append('file', thumb.files[0]);
      const r = await api('/api/problems/thumbnail', { method: 'POST', form: up });
      thumbnail_url = typeof r.url === 'string' ? r.url : null;
    }
    const teamMode = fd.get('team_mode');
    const payload = {
      title: String(fd.get('title')).trim(), domain: fd.get('domain'),
      problem_type: fd.get('problem_type'), status: 'open', thumbnail_url,
      reward_amount: fd.get('problem_type') === 'industry_challenge' && fd.get('reward_amount') ? Number(fd.get('reward_amount')) : null,
      milestones: 1, deadline: fd.get('deadline'), judging_deadline: fd.get('judging_deadline'),
      context: String(fd.get('context')).trim(), problem_stmt: String(fd.get('problem_stmt')).trim(),
      scope: String(fd.get('scope')).trim(), constraints: String(fd.get('constraints')).trim(),
      deliverables: String(fd.get('deliverables')).trim(), team_mode: teamMode,
      min_team_size: teamMode === 'solo' ? 1 : (Number(fd.get('min_team_size')) || 2),
      max_team_size: teamMode === 'solo' ? 1 : (Number(fd.get('max_team_size')) || 4),
      mentor_required: !!fd.get('mentor_required'), max_mentors_per_team: Number(fd.get('max_mentors_per_team')) || 1,
    };
    const r = await api('/api/problems/create', { method: 'POST', body: payload });
    formMsg.innerHTML = `<div class="pp-ok">${esc(r.warning ? r.warning + ' Run supabase/migrations/20260313_add_problem_thumbnail.sql to enable thumbnails.' : 'Problem posted successfully. You can track it from your dashboard.')}</div>`;
    showPopup();
    setTimeout(() => location.href = '/poster/dashboard', 1200);
  } catch (err) {
    let m = err.message;
    if (m.includes('min_deadline')) m = 'Submission deadline is too soon. Please choose a later date.';
    formMsg.innerHTML = `<div class="pp-err">${esc(m)}</div>`;
    msg.innerHTML = alertBox(m);
    btn.disabled = false; btn.textContent = 'Submit for review';
  }
});
</script>
</body>
</html>
