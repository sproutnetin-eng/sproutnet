<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enrollments — SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .pen-wrap { max-width: 1100px; margin: 0 auto; padding: clamp(32px, 6vw, 52px) clamp(16px, 4vw, 24px); }
  .pen-head { margin-bottom: 24px; }
  .pen-head h1 { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(26px, 5vw, 34px); font-weight: 400; color: #1C1410; letter-spacing: -0.5px; margin: 0 0 8px; }
  .pen-head p { font-size: 14px; color: #4A3F38; font-weight: 300; margin: 0; }
  .pen-empty { text-align: center; padding: 80px 24px; background: #fff; border-radius: 12px; border: 1.5px solid rgba(28,20,16,0.07); }
  .pen-empty .big { font-size: 40px; margin-bottom: 16px; }
  .pen-empty .t { font-family: Sora, sans-serif; font-size: 18px; font-weight: 600; color: #1C1410; margin-bottom: 8px; }
  .pen-empty .d { font-size: 14px; color: #9CA3A0; }
  .pen-list { display: grid; gap: 12px; }
  .pen-card { background: #fff; border: 1.5px solid rgba(28,20,16,0.07); border-radius: 12px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; row-gap: 12px; flex-wrap: wrap; }
  .pen-who { display: flex; align-items: center; gap: 12px; }
  .pen-avatar { width: 32px; height: 32px; border-radius: 50%; background: #2D6A4F; display: flex; align-items: center; justify-content: center; color: #fff; font-family: Sora, sans-serif; font-size: 12px; font-weight: 700; }
  .pen-name { font-family: Sora, sans-serif; font-size: 14px; font-weight: 600; color: #1C1410; }
  .pen-sub { font-size: 12px; color: #9CA3A0; }
  .pen-remove { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: #DC2626; background: rgba(220,38,38,0.08); border: 1px solid rgba(220,38,38,0.2); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .pen-remove:disabled { cursor: not-allowed; }
</style>
</head>
<body>
<div id="sn-nav"></div>
<main class="pen-wrap">
  <div class="pen-head">
    <h1>Enrollments</h1>
    <p id="subtitle" role="status" aria-label="Loading"><span class="sr-only">Loading…</span><span class="sk sk-line" aria-hidden="true" style="display:inline-block;width:220px;vertical-align:middle"></span></p>
  </div>
  <div id="msg"></div>
  <div id="list" role="status" aria-label="Loading enrollments"><span class="sr-only">Loading enrollments...</span><div class="pen-list" aria-hidden="true"><div class="pen-card"><div class="sk sk-circle" style="width:32px;height:32px"></div><div style="flex:1"><div class="sk sk-line" style="width:40%;margin-bottom:8px"></div><div class="sk sk-line" style="width:65%"></div></div></div><div class="pen-card"><div class="sk sk-circle" style="width:32px;height:32px"></div><div style="flex:1"><div class="sk sk-line" style="width:35%;margin-bottom:8px"></div><div class="sk sk-line" style="width:60%"></div></div></div></div></div>
</main>
<script src="/assets/config.js"></script>
<script type="module">
import { api, requireRole, renderNav, esc, alertBox } from '/assets/app.js';
import { icon } from '/assets/icons.js';
renderNav();
const me = await requireRole('poster', 'admin');
const id = location.pathname.split('/')[3];
const msg = document.getElementById('msg');
const list = document.getElementById('list');
let enrollments = [];
function render() {
  if (!enrollments.length) {
    list.innerHTML = `<div class="pen-empty"><div class="big">${icon('users', 44)}</div><div class="t">No enrollments yet</div><div class="d">Students will appear here after they enroll.</div></div>`;
    return;
  }
  list.innerHTML = `<div class="pen-list">` + enrollments.map(x => `<div class="pen-card">
    <div class="pen-who"><div class="pen-avatar">${esc((x.users?.name || '?')[0])}</div>
    <div><div class="pen-name">${esc(x.users?.name || 'Student')}</div><div class="pen-sub">${esc(x.users?.dept || 'Department')} · ${esc(x.users?.year || 'Year')}</div></div></div>
    <button type="button" class="pen-remove" data-id="${esc(x.id)}">Remove</button>
  </div>`).join('') + `</div>`;
}
if (me) {
  if (!id) location.href = '/poster/problems';
  else {
    try {
      const { problem, enrollments: rows } = await api(`/api/poster/problems/${id}/enrollments`);
      document.getElementById('subtitle').textContent = problem.title;
      enrollments = rows;
      render();
    } catch (e) { msg.innerHTML = alertBox(e.message); }
  }
}
list.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-id]');
  if (!btn) return;
  if (!confirm('Remove this student? They will not be able to submit.')) return;
  btn.disabled = true;
  try {
    await api('/api/enrollments/remove', { method: 'POST', body: { enrollment_id: btn.dataset.id, problem_id: id } });
    enrollments = enrollments.filter(x => x.id !== btn.dataset.id);
    render();
  } catch (err) { msg.innerHTML = alertBox(err.message); btn.disabled = false; }
});
</script>
</body>
</html>
