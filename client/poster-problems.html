<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Problems — SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .pl-wrap { max-width: 1100px; margin: 0 auto; padding: clamp(32px, 6vw, 52px) clamp(16px, 4vw, 24px); }
  .pl-head { margin-bottom: 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .pl-head h1 { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(28px, 6vw, 38px); font-weight: 400; color: #1C1410; letter-spacing: -0.5px; margin: 0 0 8px; }
  .pl-head p { font-size: 15px; color: #4A3F38; font-weight: 300; margin: 0; }
  .pl-post { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: #1C1410; background: #F4A723; padding: 10px 18px; border-radius: 8px; text-decoration: none; }
  .pl-empty { text-align: center; padding: 80px 24px; background: #fff; border-radius: 12px; border: 1.5px solid rgba(28,20,16,0.07); }
  .pl-empty .big { font-size: 40px; margin-bottom: 16px; }
  .pl-empty .t { font-family: Sora, sans-serif; font-size: 18px; font-weight: 600; color: #1C1410; margin-bottom: 8px; }
  .pl-empty .d { font-size: 14px; color: #9CA3A0; }
  .pl-list { display: grid; gap: 14px; }
  .pl-card { background: #fff; border: 1.5px solid rgba(28,20,16,0.06); border-radius: 14px; padding: 18px 20px; box-shadow: 0 8px 30px rgba(28,20,16,0.06); display: flex; flex-direction: column; gap: 12px; }
  .pl-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pl-pill { font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 999px; }
  .pl-pill.domain { color: #2D6A4F; background: #EAF4EE; }
  .pl-pill.open { color: #15803d; background: rgba(21,128,61,0.12); text-transform: capitalize; }
  .pl-pill.held { color: #92400e; background: rgba(146,64,14,0.12); text-transform: capitalize; }
  .pl-pill.archived { color: #57534e; background: rgba(28,20,16,0.08); text-transform: capitalize; }
  .pl-sec-t { font-family: Sora, sans-serif; font-size: 15px; font-weight: 700; color: #1C1410; margin: 22px 0 12px; }
  .pl-sec-t:first-child { margin-top: 0; }
  .pl-sec-d { font-size: 13px; color: #9CA3A0; margin: -8px 0 12px; }
  .pl-title { font-family: Sora, sans-serif; font-size: 17px; font-weight: 650; color: #0f0a08; }
  .pl-meta { font-size: 13px; color: #4A3F38; display: flex; gap: 10px; flex-wrap: wrap; }
  .pl-foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; border-top: 1px solid rgba(28,20,16,0.06); padding-top: 12px; }
  .pl-btn { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: #1C1410; text-decoration: none; border: 1px solid rgba(28,20,16,0.12); border-radius: 9px; padding: 7px 12px; background: rgba(28,20,16,0.02); cursor: pointer; }
  .pl-btn.toggle { font-weight: 700; color: #0f0a08; box-shadow: 0 2px 10px rgba(28,20,16,0.08); }
  .pl-btn.hold { background: #FCD34D; }
  .pl-btn.publish { background: #BBF7D0; }
  .pl-btn.del { font-weight: 700; color: #DC2626; background: rgba(220,38,38,0.08); border: 1px solid rgba(220,38,38,0.2); box-shadow: 0 2px 10px rgba(220,38,38,0.12); }
  .pl-btn:disabled { cursor: not-allowed; opacity: 0.7; }
</style>
</head>
<body>
<div id="sn-nav"></div>
<main class="pl-wrap">
  <div class="pl-head">
    <div><h1>My problems</h1><p>Edit, hold, or delete the problems you&#8217;ve posted.</p></div>
    <a class="pl-post" href="/poster/post-problem">+ Post a Problem</a>
  </div>
  <div id="msg"></div>
  <div id="list"><div class="pl-list" role="status" aria-label="Loading problems"><span class="sr-only">Loading…</span>
    <div class="pl-card" aria-hidden="true"><div class="sk sk-line" style="width:30%;margin-bottom:10px"></div><div class="sk" style="height:22px;width:70%;margin-bottom:10px"></div><div class="sk sk-line" style="width:50%"></div></div>
    <div class="pl-card" aria-hidden="true"><div class="sk sk-line" style="width:28%;margin-bottom:10px"></div><div class="sk" style="height:22px;width:65%;margin-bottom:10px"></div><div class="sk sk-line" style="width:45%"></div></div>
  </div></div>
</main>
<script src="/assets/config.js"></script>
<script type="module">
import { api, requireRole, renderNav, esc, alertBox } from '/assets/app.js';
import { icon } from '/assets/icons.js';
renderNav();
const me = await requireRole('poster', 'admin');
const list = document.getElementById('list');
const msg = document.getElementById('msg');
async function load() {
  try {
    const { problems } = await api('/api/poster/problems');
    if (!problems.length) {
      list.innerHTML = `<div class="pl-empty"><div class="big">${icon('inbox', 44)}</div><div class="t">No problems yet</div><div class="d">Post your first problem to see it here.</div></div>`;
      return;
    }
    const nowMs = Date.now();
    const isExpired = (p) => {
      if (!p.deadline) return false;
      const t = new Date(p.deadline).getTime();
      return !Number.isNaN(t) && t < nowMs;
    };
    const active = problems.filter((p) => !isExpired(p));
    const archived = problems.filter((p) => isExpired(p));
    const card = (p) => {
      const open = p.status === 'open';
      const expired = isExpired(p);
      const dl = p.deadline ? new Date(p.deadline).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
      return `<div class="pl-card" data-id="${esc(p.id)}">
        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="pl-pills">
            <span class="pl-pill domain">${esc(p.domain)}</span>
            <span class="pl-pill ${open ? 'open' : 'held'}">${esc(p.status)}</span>
            ${expired ? `<span class="pl-pill archived">archived · enrollment closed</span>` : ''}
          </div>
          <div class="pl-title">${esc(p.title)}</div>
          <div class="pl-meta"><span>${esc(p.problem_type === 'industry_challenge' ? 'Industry Challenge' : 'Public Impact')}</span><span>· deadline ${esc(dl)}</span>${expired ? `<span>· enrollments closed</span>` : ''}</div>
        </div>
        <div class="pl-foot">
          <a class="pl-btn" href="/poster/solutions?problem=${esc(p.id)}">Solutions</a>
          <a class="pl-btn" href="/poster/problems/${esc(p.id)}/enrollments">Enrolled</a>
          <a class="pl-btn" href="/poster/problems/${esc(p.id)}/edit">Edit</a>
          <button type="button" class="pl-btn toggle ${open ? 'hold' : 'publish'}" data-act="toggle">${open ? 'Hold' : 'Publish'}</button>
          <button type="button" class="pl-btn del" data-act="delete">Delete</button>
        </div>
      </div>`;
    };
    list.innerHTML =
      (active.length
        ? `<div class="pl-sec-t">Active (${active.length})</div><div class="pl-list">` + active.map(card).join('') + `</div>`
        : '')
      + (archived.length
        ? `<div class="pl-sec-t">Archived — enrollment closed (${archived.length})</div><div class="pl-sec-d">Deadline passed: hidden from students, still visible to you.</div><div class="pl-list">` + archived.map(card).join('') + `</div>`
        : '')
      || `<div class="pl-empty"><div class="big">${icon('inbox', 44)}</div><div class="t">No problems yet</div><div class="d">Post your first problem to see it here.</div></div>`;
  } catch (e) { msg.innerHTML = alertBox(e.message); }
}
list.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.closest('.pl-card').dataset.id;
  const act = btn.dataset.act;
  if (act === 'delete' && !confirm('Delete this problem? This cannot be undone.')) return;
  btn.disabled = true;
  try {
    if (act === 'toggle') {
      const isOpen = btn.textContent.trim() === 'Hold';
      await api('/api/problems/status', { method: 'POST', body: { id, status: isOpen ? 'pending' : 'open' } });
    } else {
      await api('/api/problems/delete', { method: 'POST', body: { id } });
    }
    await load();
  } catch (err) { msg.innerHTML = alertBox(err.message); btn.disabled = false; }
});
if (me) load();
</script>
</body>
</html>
