<script type="module">
import { sb, api, esc, renderNav, alertBox } from '/assets/app.js';
import { icon } from '/assets/icons.js';
renderNav();
const id = location.pathname.split('/')[2];
const SECTIONS = [
  ['context', 'Background & Context', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>'],
  ['problem_stmt', 'The Problem', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>'],

  ['constraints', 'Constraints', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'],
  ['deliverables', 'Deliverables', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>'],
];
const FRAMEWORK = ['Problem Understanding','Root Cause Analysis','Proposed Solution','Feasibility Assessment','Expected Impact','Risks & Limitations','Implementation Plan'];
let problem = null, comments = [], me = null, activeSection = 'context';
let sortBy = 'newest', searchQuery = '', likeCounts = {}, liked = new Set();
let enroll = { enrolled: false, hasSubmitted: false, completed: false, submissionStatus: null };

try { liked = new Set(JSON.parse(localStorage.getItem('sn_likes') || '[]')); } catch {}

const msg = (h) => { document.getElementById('msg').innerHTML = h; };
const rel = (d) => { const s = Math.max(0, (Date.now() - new Date(d).getTime()) / 1000);
  if (s < 60) return 'Just now'; if (s < 3600) return Math.floor(s/60)+'m ago';
  if (s < 86400) return Math.floor(s/3600)+'h ago'; if (s < 604800) return Math.floor(s/86400)+'d ago';
  return new Date(d).toLocaleDateString('en-IN', { day:'numeric', month:'short' }); };

function domainIcon(domain) {
  const p = (inner) => `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  switch (domain) {

    case 'Climate': return p('<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>');
    case 'Healthcare': return p('<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>');
    case 'Public Infrastructure':
    case 'Urban Mobility': return p('<rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>');
    case 'Agriculture': return p('<path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12A10 10 0 0 1 12 2z"/><path d="M12 6v12"/>');
    case 'Education': return p('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>');
    default: return p('<circle cx="12" cy="12" r="10"/>');
  }
}

function inlineFmt(raw) {
  const e = esc(raw);
  const parts = e.split(/(\*\*[^*]+\*\*|\*[^*]+\*|`[^`]+`)/g);
  return parts.map((part) => {
    if (part.startsWith('**') && part.endsWith('**') && part.length > 4) return `<strong>${part.slice(2, -2)}</strong>`;
    if (part.startsWith('*') && part.endsWith('*') && part.length > 2) return `<em>${part.slice(1, -1)}</em>`;
    if (part.startsWith('`') && part.endsWith('`') && part.length > 2) return `<code>${part.slice(1, -1)}</code>`;
    return part;
  }).join('');
}
function fmtBody(t) {
  return esc(t || '').split('\n').map((line) => {
    const raw = line.startsWith('&gt; ') ? line.slice(5) : (line.startsWith('> ') ? line.slice(2) : null);
    if (raw !== null) return `<blockquote>${inlineFmt(raw)}</blockquote>`;
    if (line.trim() === '') return '<br>';
    return inlineFmt(line);
  }).join('<br>');
}

function matchesQuery(c) {
  if (!searchQuery.trim()) return true;
  const ql = searchQuery.toLowerCase();
  if ((c.body || '').toLowerCase().includes(ql) || (c.users?.name || '').toLowerCase().includes(ql)) return true;
  return comments.filter((k) => k.parent_id === c.id).some(matchesQuery);
}
function sortedRoots() {
  let roots = comments.filter((c) => !c.parent_id && matchesQuery(c));
  roots = [...roots].sort((a, b) => sortBy === 'top'
    ? ((likeCounts[b.id] ?? 0) - (likeCounts[a.id] ?? 0))
    : sortBy === 'oldest' ? new Date(a.created_at) - new Date(b.created_at) : new Date(b.created_at) - new Date(a.created_at));
  return roots;
}

function commentCard(c, child = false) {
  const isPoster = problem && c.author_id === problem.poster_id;
  const isLiked = liked.has(c.id);
  const likes = likeCounts[c.id] ?? 0;
  const replies = comments.filter((r) => r.parent_id === c.id);
  const hasMatchChild = searchQuery.trim().length > 0 && replies.some(matchesQuery);
  const open = expanded.has(c.id) || hasMatchChild;
  const kids = open && replies.length
    ? `<div class="child-list">${replies.map((r) => commentCard(r, true)).join('')}</div>` : '';
  const replyBox = replyingTo === c.id ? `<div class="reply-box">
      <textarea class="reply-ta" id="reply-ta" rows="2" placeholder="Replying to ${esc(c.users?.name || 'user')}...">${esc(replyDraft)}</textarea>
      <div class="reply-foot">
        <button type="button" class="reply-cancel" data-cancel-reply>Cancel</button>
        <button type="button" class="reply-send" data-send-reply="${esc(c.id)}" ${postingReply || !replyDraft.trim() ? 'disabled' : ''}>${postingReply ? 'Posting...' : 'Post Reply'}</button>
      </div>
    </div>` : '';
  return `<div class="cmt-wrap ${child ? 'child' : ''}">
    ${child ? '<div class="thread-line"></div>' : ''}
    <div class="cmt ${isPoster ? 'poster' : ''}">
      <div class="cmt-top"><div class="cmt-who">
        <div class="cmt-avatar ${isPoster ? 'op' : ''}">${esc((c.users?.name || '?').charAt(0).toUpperCase())}</div>
        <div><div class="cmt-name">${esc(c.users?.name || 'Community Contributor')}
          ${isPoster ? '<span class="cmt-op"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>OP / Problem Poster</span>' : (c.users?.role ? `<span class="cmt-role">${esc(c.users.role)}</span>` : '')}
        </div><div class="cmt-time">${esc(rel(c.created_at))}</div></div>
      </div></div>
      <div class="cmt-body">${fmtBody(c.body)}</div>
      <div class="cmt-actions">
        <button type="button" class="pill-up ${isLiked ? 'liked' : ''}" data-like="${esc(c.id)}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="${isLiked ? '#DC2626' : 'none'}" stroke="${isLiked ? '#DC2626' : '#4A3F38'}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <span>${likes} ${likes === 1 ? 'upvote' : 'upvotes'}</span></button>
        ${me ? `<button type="button" class="pill-reply" data-reply="${esc(c.id)}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>Reply</button>` : ''}
        ${replies.length ? `<button type="button" class="pill-ghost" data-toggle="${esc(c.id)}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>${open ? 'Hide replies' : `${replies.length} ${replies.length === 1 ? 'reply' : 'replies'}`}</span></button>` : ''}
        <button type="button" class="pill-share ${copiedLinkId === c.id ? 'copied' : ''}" data-share="${esc(c.id)}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>${copiedLinkId === c.id ? 'Link copied!' : 'Share'}</button>
      </div>
      ${replyBox}
    </div>
    ${kids}
  </div>`;
}

function renderDiscussion() {
  const box = document.getElementById('discussion');
  if (!box) return;
  const roots = sortedRoots();
  const visible = roots.slice(0, visibleCount);
  const sortBtn = (mode, label, icon) => `<button type="button" class="sortbtn ${sortBy === mode ? 'on' : ''}" data-sort="${mode}">${icon}${label}</button>`;
  const icoTop = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>';
  const icoNew = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
  const icoOld = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>';
  let listHtml;
  if (!comments.length) {
    listHtml = `<div class="empty-disc"><div class="empty-disc-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>

    listHtml = `<div class="no-match">No responses matching &quot;<strong>${esc(searchQuery)}</strong>&quot;.</div>`;
  } else {
    listHtml = visible.map((c) => commentCard(c)).join('') + (roots.length > visibleCount ? `<div class="loadmore-wrap">

  }
  box.innerHTML = `

        <div><h2 class="disc-title">Discussion Thread</h2>
        <div class="disc-sub">${comments.length} contribution${comments.length === 1 ? '' : 's'} from community &amp; poster</div></div>
      </div>
      <div class="disc-tools">

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CA3A0" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="disc-search" id="d-search" type="text" placeholder="Search responses..." value="${esc(searchQuery)}">
        </div>
        <div class="sortbar">${sortBtn('newest', 'Latest', icoNew)}${sortBtn('top', 'Top', icoTop)}${sortBtn('oldest', 'Oldest', icoOld)}</div>
      </div>
    </div>
    ${me ? `<div class="composer" id="discussion-composer">
      <div class="composer-head">
        <div class="composer-who"><div class="avatar-sm">${esc((me.name || '?').charAt(0).toUpperCase())}</div>
          <div>Add to discussion as <span class="who">${esc(me.name)}</span></div></div>

    </div>` : `<div class="login-cta">
      <div class="login-cta-title">Join the SproutNet Community</div>
      <div class="login-cta-sub">Sign in to post replies, upvote helpful contributions, and connect with the problem author.</div>
      <a class="login-cta-btn" href="/login">Sign in to Participate →</a>
    </div>`}

  const s = document.getElementById('d-search');
  if (s) s.oninput = (e) => { searchQuery = e.target.value; renderDiscussion();
    const s2 = document.getElementById('d-search'); s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); };
  box.querySelectorAll('[data-sort]').forEach((b) => b.addEventListener('click', () => { sortBy = b.dataset.sort; renderDiscussion(); }));
  const ta = document.getElementById('d-body');
  if (ta) {
    ta.oninput = (e) => { composerDraft = e.target.value; renderDiscussion();
      const t2 = document.getElementById('d-body'); t2.focus(); t2.setSelectionRange(t2.value.length, t2.value.length); };
    ta.onkeydown = (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); postComment(); } };
  }
  box.querySelectorAll('[data-md]').forEach((b) => b.addEventListener('click', () => { composerDraft += b.dataset.md; renderDiscussion();
    const t2 = document.getElementById('d-body'); if (t2) t2.focus(); }));
  box.querySelector('[data-clear]')?.addEventListener('click', () => { composerDraft = ''; renderDiscussion(); });
  document.getElementById('d-post')?.addEventListener('click', postComment);
  box.querySelectorAll('[data-like]').forEach((b) => b.addEventListener('click', async () => {
    const cid = b.dataset.like;
    if (!me) { location.href = '/login'; return; }
    const on = liked.has(cid);
    on ? liked.delete(cid) : liked.add(cid);
    likeCounts[cid] = Math.max(0, (likeCounts[cid] ?? 0) + (on ? -1 : 1));
    try { localStorage.setItem('sn_likes', JSON.stringify([...liked])); } catch {}
    renderDiscussion();
    try { const d = await api('/api/discussion/like', { method: 'POST', body: { commentId: cid } });
      if (d.likes_count != null) { likeCounts[cid] = d.likes_count; renderDiscussion(); } } catch {}
  }));
  box.querySelectorAll('[data-reply]').forEach((b) => b.addEventListener('click', () => {
    const pid = b.dataset.reply;
    replyingTo = replyingTo === pid ? null : pid; replyDraft = ''; renderDiscussion();
    const r = document.getElementById('reply-ta'); if (r) r.focus();
  }));
  box.querySelector('[data-cancel-reply]')?.addEventListener('click', () => { replyingTo = null; replyDraft = ''; renderDiscussion(); });
  const rta = document.getElementById('reply-ta');
  if (rta) rta.oninput = (e) => { replyDraft = e.target.value;
    const btn = box.querySelector('[data-send-reply]'); if (btn) btn.disabled = postingReply || !replyDraft.trim(); };
  box.querySelector('[data-send-reply]')?.addEventListener('click', async (e) => {
    const pid = e.currentTarget.dataset.sendReply;
    if (!replyDraft.trim()) return;
    postingReply = true; renderDiscussion();
    try { const { comment } = await api('/api/discussion', { method: 'POST', body: { problem_id: id, body: replyDraft.trim(), parent_id: pid } });
      if (comment) { comments.push(comment); likeCounts[comment.id] = 0; expanded.add(pid); }
    } catch (err) { msg(alertBox(err.message)); }
    replyDraft = ''; replyingTo = null; postingReply = false; renderDiscussion();
  });
  box.querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', () => {
    const cid = b.dataset.toggle;
    expanded.has(cid) ? expanded.delete(cid) : expanded.add(cid); renderDiscussion();
  }));
  box.querySelectorAll('[data-share]').forEach((b) => b.addEventListener('click', async () => {
    const cid = b.dataset.share;
    try { await navigator.clipboard.writeText(`${location.origin}${location.pathname}#comment-${cid}`);
      copiedLinkId = cid; renderDiscussion(); setTimeout(() => { copiedLinkId = null; renderDiscussion(); }, 2000); } catch {}
  }));
  box.querySelector('[data-loadmore]')?.addEventListener('click', () => { visibleCount += 5; renderDiscussion(); });
}

async function postComment() {
  if (!composerDraft.trim() || !me || posting) return;
  posting = true; renderDiscussion();
  try { const { comment } = await api('/api/discussion', { method: 'POST', body: { problem_id: id, body: composerDraft.trim(), parent_id: null } });
    if (comment) { comments.push(comment); likeCounts[comment.id] = 0; }
  } catch (err) { msg(alertBox(err.message)); }
  composerDraft = ''; posting = false; renderDiscussion();
}

function ctaHtml() {
  const closed = problem && problem.deadline ? (Math.ceil((new Date(problem.deadline).getTime() - Date.now()) / 86400000) < 0) : false;
  if (closed && !(enroll.enrolled || enroll.completed)) return `<div class="cta-stack">
    <div class="cta-done" style="background:rgba(250,248,244,0.08);color:rgba(250,248,244,0.85);border:1px solid rgba(250,248,244,0.2)">Enrollment closed</div>
    <div class="cta-note">The submission deadline for this problem has passed. New enrollments are closed.</div></div>`;
  if (!me) return `<a class="cta-btn" href="/login">Sign in to Solve →</a>`;
  if (me.role !== 'student') return `<div class="cta-stack">
    <div class="cta-note">You&apos;re signed in as a ${esc(me.role)} account. Enroll is only available for student accounts.</div>
    <a class="cta-btn" href="/login/student">Switch to Student Login →</a>
    <div class="cta-note-dim">Student accounts can enroll and submit solutions.</div></div>`;
  if (enroll.completed) return `<div class="cta-stack">
    <div class="cta-done">Problem completed</div>
    <div class="cta-note">You have already fully submitted this problem and can unlock a new enrollment slot.</div></div>`;
  if (enroll.enrolled) {
    return `<div class="cta-stack">
      ${enroll.submissionStatus === 'approved' ? `<a class="cta-btn-green" href="/problems/${esc(id)}/final-upload">${icon('sparkles', 15)} Approved! Upload Final Work (APK, papers…) →</a>` : ''}
      ${enroll.submissionStatus === 'pending' ? `<div class="banner banner-pending">${icon('activity', 14)} Submitted — waiting for the poster to review</div>` : ''}
      ${enroll.submissionStatus === 'rejected' ? '<div class="banner banner-rejected">${icon("x", 14)} Solution was not approved — improve it and resubmit</div>' : ''}
      <a class="cta-btn" href="/problems/${esc(id)}/submit">${enroll.hasSubmitted ? 'Continue Solving →' : 'Start Solving →'}</a>
      <button type="button" class="cancel-link" id="cancel-enroll">Cancel enrollment</button>
      <div id="enroll-err"></div></div>`;
  }
  const teamMode = problem.team_mode;
  const teamable = teamMode === 'team' || teamMode === 'both';
  if (teamable && userTeam) {
    return `<div class="cta-stack">
      <div class="team-member-note">You are a member of <strong>${esc(userTeam.teams?.name || userTeam.team_name || 'your team')}</strong></div>
      <a class="cta-btn" href="/teams/${esc(userTeam.team_id)}">Go to Workspace →</a>
      ${teamMode === 'both' ? '<button type="button" class="cta-ghost-sm" id="enroll-solo">Or solve solo</button><div id="enroll-err"></div>' : ''}</div>`;
  }
  if (teamable) {
    let inner = '';
    if (teamMode === 'both') inner += `<button type="button" class="cta-btn" id="enroll-solo">Solve Solo →</button><div id="enroll-err"></div><div class="cta-or">or</div>`;
    if (!showCreateTeam && !showJoinTeam) inner += `<div class="cta-stack">
      <button type="button" class="cta-btn-green" id="show-create">Create a Team →</button>
      <button type="button" class="cta-ghost" id="show-join">Join with Invite Code</button></div>`;
    if (showCreateTeam && !createdInviteCode) inner += `<div class="team-form">
      <input class="team-input" id="team-name" placeholder="Team name">
      <div class="team-row"><button type="button" class="cta-btn" id="team-create">Create</button>
      <button type="button" class="team-cancel" id="team-cancel-create">Cancel</button></div></div>`;
    if (createdInviteCode) inner += `<div class="invite-panel">
      <div class="invite-kicker">Invite Code</div>
      <div class="invite-code">${esc(createdInviteCode)}</div>
      <button type="button" class="invite-copy" id="copy-invite">Copy Invite Code</button>
      <a class="invite-go" id="invite-go" href="/teams/${esc(userTeam?.team_id || '')}">Go to Workspace →</a></div>`;
    if (showJoinTeam) inner += `<div class="team-form">
      <input class="team-input upper" id="invite-code" placeholder="Enter invite code (e.g. SPROUT-XXXXXX)">
      <div class="team-row"><button type="button" class="cta-btn" id="team-join">Join</button>
      <button type="button" class="team-cancel" id="team-cancel-join">Cancel</button></div></div>`;
    if (teamErr) inner += `<div class="cta-err">${esc(teamErr)}</div>`;
    if (teamMsg && !createdInviteCode) inner += `<div class="cta-ok">${esc(teamMsg)}</div>`;
    return `<div class="cta-stack">${inner}</div>`;
  }
  return `<div class="cta-stack"><button type="button" class="cta-btn" id="enroll-solo">Enroll to Solve →</button><div id="enroll-err"></div></div>`;
}

function renderActions() {
  const el = document.getElementById('act');
  if (!el) return;
  el.innerHTML = ctaHtml();
  document.getElementById('enroll-solo')?.addEventListener('click', async (e) => {
    e.currentTarget.disabled = true; e.currentTarget.textContent = 'Enrolling...';
    try { await api('/api/enrollments/create', { method: 'POST', body: { problem_id: id } });
      location.href = `/problems/${id}/submit`;
    } catch (err) { const ee = document.getElementById('enroll-err');
      if (ee) ee.innerHTML = `<div class="cta-err-big">${esc(err.message)}</div>`; renderActions(); }
  });
  document.getElementById('cancel-enroll')?.addEventListener('click', async (e) => {
    e.currentTarget.disabled = true;
    try { await api('/api/enrollments/cancel', { method: 'POST', body: { problem_id: id } });
      enroll = { enrolled: false, hasSubmitted: false, completed: false, submissionStatus: null }; renderActions();
    } catch (err) { const ee = document.getElementById('enroll-err');
      if (ee) ee.innerHTML = `<div class="cta-err-big">${esc(err.message)}</div>`; renderActions(); }
  });
  document.getElementById('show-create')?.addEventListener('click', () => { showCreateTeam = true; showJoinTeam = false; teamErr = ''; teamMsg = ''; renderActions(); });
  document.getElementById('show-join')?.addEventListener('click', () => { showJoinTeam = true; showCreateTeam = false; teamErr = ''; teamMsg = ''; renderActions(); });
  document.getElementById('team-cancel-create')?.addEventListener('click', () => { showCreateTeam = false; renderActions(); });
  document.getElementById('team-cancel-join')?.addEventListener('click', () => { showJoinTeam = false; renderActions(); });
  document.getElementById('team-create')?.addEventListener('click', async (e) => {
    const name = document.getElementById('team-name').value.trim();
    if (!name) return;
    e.currentTarget.disabled = true; teamErr = ''; teamMsg = '';
    try { const d = await api('/api/teams/create', { method: 'POST', body: { problemId: id, teamName: name } });
      createdInviteCode = d.inviteCode; teamMsg = 'Team created! Share the invite code with your teammates.';
      userTeam = { team_id: d.teamId, role: 'leader', teams: { id: d.teamId, name, invite_code: d.inviteCode } };
    } catch (err) { teamErr = err.message; }
    renderActions();
  });
  document.getElementById('team-join')?.addEventListener('click', async (e) => {
    const code = document.getElementById('invite-code').value.trim();
    if (!code) return;
    e.currentTarget.disabled = true; teamErr = ''; teamMsg = '';
    try { const d = await api('/api/teams/join', { method: 'POST', body: { inviteCode: code } });
      teamMsg = 'Joined team successfully!';
      userTeam = { team_id: d.teamId, role: 'member', teams: { id: d.teamId, name: d.teamName } };
    } catch (err) { teamErr = err.message; }
    renderActions();
  });
  document.getElementById('copy-invite')?.addEventListener('click', async (e) => {
    try { await navigator.clipboard.writeText(createdInviteCode); e.currentTarget.textContent = 'Copied!'; setTimeout(renderActions, 2000); } catch {}
  });
}

function render() {
  const isIndustry = problem.problem_type === 'industry_challenge';
  const daysLeft = Math.ceil((new Date(problem.deadline).getTime() - Date.now()) / 86400000);
  const closed = !isNaN(daysLeft) && daysLeft < 0;
  const teamMode = problem.team_mode;
  const judging = problem.judging_deadline ? new Date(problem.judging_deadline).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '—';
  const diff = problem.difficulty_label;
  document.getElementById('content').innerHTML = `<div class="pd-page"><div class="pd-grid">
    <div class="pd-main">
      <div class="pd-badges">
        <span class="bdg bdg-domain">${domainIcon(problem.domain)} ${esc(problem.domain || '')}</span>
        <span class="bdg ${isIndustry ? 'bdg-ind' : 'bdg-pub'}">${isIndustry
          ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>Industry Challenge · ₹${esc((problem.reward_amount ?? 0).toLocaleString('en-IN'))}`
          : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>Public Impact`}</span>
        <span class="bdg ${closed ? 'bdg-closed' : 'bdg-open'}"><span class="dot"></span>${closed ? 'Closed' : 'Open'}</span>
        ${(teamMode === 'team' || teamMode === 'both') ? `<span class="bdg bdg-team"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>${teamMode === 'team' ? 'Team' : 'Solo or Team'}</span>` : ''}
      </div>
      <h1 class="pd-title">${esc(problem.title)}</h1>
      ${problem.thumbnail_url ? `<div class="pd-thumb-card"><div class="pd-thumb"><img src="${esc(problem.thumbnail_url)}" alt="${esc(problem.title)} thumbnail" loading="eager" fetchpriority="high" decoding="async"></div></div>` : ''}
      <div class="pd-tabs">${SECTIONS.map(([k, l, icon]) => `<button type="button" data-sec="${k}" class="${activeSection === k ? 'on' : ''}">${icon} ${esc(l)}</button>`).join('')}</div>
      ${SECTIONS.filter(([k]) => activeSection === k).map(([k, l, icon]) => `<div class="pd-sec-card">
        <div class="pd-sec-kicker">${icon} ${esc(l)}</div>
        <p class="pd-sec-body">${esc(problem[k] || '—')}</p></div>`).join('')}
      <div class="disc"><div id="discussion"></div></div>
    </div>
    <div class="pd-side">
      <div class="cta">
        <div class="cta-title">${enroll.completed ? 'You finished this problem.' : (enroll.hasSubmitted ? 'You\u2019ve started this.' : 'Start solving this problem.')}</div>
        <div id="act"></div>
      </div>
      <div class="stats-card">
        <div class="stat-row"><span class="stat-label">Days Left</span><span class="stat-val ${closed ? '' : (isNaN(daysLeft) ? '' : (daysLeft <= 7 ? 'stat-val-soon' : 'stat-val-days'))}">${isNaN(daysLeft) ? '—' : (closed ? 'Enrollment closed' : `${daysLeft}d`)}</span></div>
        <div class="stat-row"><span class="stat-label">Submissions</span><span class="stat-val">${esc(String(problem.submission_count ?? 0))}</span></div>
        <div class="stat-row"><span class="stat-label">Judging by</span><span class="stat-val">${esc(judging)}</span></div>
      </div>
      ${diff ? `<div class="ai-card">
        <div class="ai-tiles">
          <div class="ai-tile diff-${esc(diff)}"><div class="ai-tile-name diff-${esc(diff)}">${esc(diff)}</div>
            <div class="ai-tile-val">${problem.difficulty_score != null ? `${Number(problem.difficulty_score).toFixed(1)} / 10` : '—'}</div></div>
          <div class="ai-tile neutral"><div class="ai-tile-name neutral">Impact</div>
            <div class="ai-tile-val">${problem.impact_score != null ? `${Number(problem.impact_score).toFixed(1)} / 10` : '—'}</div></div>
          ${problem.estimated_hours ? `<div class="ai-tile neutral"><div class="ai-tile-name neutral">Effort</div><div class="ai-tile-val">~${esc(String(problem.estimated_hours))}h</div></div>` : ''}
        </div>
        ${problem.leaderboard_weight && problem.leaderboard_weight > 1 ? `<div class="ai-weight"><span><b>Leaderboard weight:</b></span><span class="mult">×${esc(String(problem.leaderboard_weight))}</span></div>` : ''}
      </div>` : ''}
      <div class="fw-card"><div class="fw-title">The Framework</div>
        ${FRAMEWORK.map((f, i) => `<div class="fw-row"><span class="fw-num">${String(i + 1).padStart(2, '0')}</span><span class="fw-name">${esc(f)}</span></div>`).join('')}
      </div>
    </div>
  </div>
  ${showFab ? `<button type="button" class="fab" id="fab"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="7"/><line x1="10" y1="9" x2="14" y2="9"/></svg>Post Response</button>` : ''}
  </div>`;
  document.querySelectorAll('[data-sec]').forEach((b) => b.addEventListener('click', () => { activeSection = b.dataset.sec; render(); }));
  document.getElementById('fab')?.addEventListener('click', () => {
    const c = document.getElementById('discussion-composer');
    if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); const t = c.querySelector('textarea'); if (t) t.focus(); }
    else location.hash = '#discussion';
  });
  renderActions();
  renderDiscussion();
}

window.addEventListener('scroll', () => {
  const total = document.documentElement.offsetHeight;
  if (window.innerHeight + window.scrollY >= total - 400) {
    const roots = sortedRoots();
    if (visibleCount < roots.length) { visibleCount += 5; renderDiscussion(); }
  }
  const c = document.getElementById('discussion-composer');
  const show = c ? c.getBoundingClientRect().bottom < 80 : window.scrollY > 400;
  if (show !== showFab) { showFab = show;
    const old = document.getElementById('fab');
    if (old) old.style.display = show ? '' : 'none';
    else if (show && problem) render();
  }
}, { passive: true });

try {
  const [{ problem: p }, disc] = await Promise.all([
    api(`/api/public/problems/${encodeURIComponent(id)}`),
    api(`/api/discussion?problem_id=${encodeURIComponent(id)}`).catch(() => ({ comments: [] })),
  ]);
  problem = p;
  comments = disc.comments || [];
  comments.forEach((c) => { likeCounts[c.id] = c.likes_count ?? 0; });
  document.title = `${problem.title} | SproutNet`;
  const { data: { session } } = await sb().auth.getSession();
  if (session) {
    try { const r = await api('/api/auth/profile'); me = r.profile ? { id: r.profile.id, name: r.profile.name, role: r.profile.role } : null; }
    catch { me = null; }
  }
  if (me && me.role === 'student') {
    try { const st = await api('/api/enrollments/status', { method: 'POST', body: { problem_id: id } });
      enroll = { enrolled: !!st.enrolled, hasSubmitted: !!st.hasSubmitted, completed: !!st.completed, submissionStatus: st.submissionStatus ?? null };
    } catch {}
    if (problem.team_mode === 'team' || problem.team_mode === 'both') {
      try {
        const { myTeams } = await api('/api/student/teams');
        for (const t of myTeams || []) {
          try { const d = await api(`/api/student/teams/${encodeURIComponent(t.team_id)}`);
            const pid = d.team?.problem_id || d.team?.problems?.id;
            if (pid === id) { userTeam = { team_id: t.team_id, role: t.role, teams: { id: t.team_id, name: t.team_name } }; break; }
          } catch {}
        }
      } catch {}
    }
  }
  render();
} catch (e) {
  document.getElementById('content').innerHTML = `<div class="pd-page"><div class="pd-notfound"><div>
    <div class="pd-nf-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2D6A4F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
    <div class="pd-nf-title">Problem not found</div>
    <a class="pd-nf-link" href="/problems">← Back to problems</a></div></div></div>`;
  if (!/404|not found/i.test(e.message)) msg(alertBox(e.message));
}
</script>
</body>
</html>
