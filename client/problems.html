<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problems | SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .prob-page { min-height: 100vh; background: #FAF8F4; font-family: 'DM Sans', sans-serif; }
  .prob-wrap { max-width: 1100px; margin: 0 auto; padding: clamp(32px, 6vw, 52px) clamp(16px, 4vw, 24px); }
  .prob-kicker { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #2D6A4F; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
  .prob-title { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(32px, 7vw, 48px); font-weight: 400; color: #1C1410; letter-spacing: -0.5px; margin: 0 0 12px 0; line-height: 1.1; }
  .prob-sub { font-size: 16px; color: #4A3F38; font-weight: 300; margin: 0; }
  .prob-head { margin-bottom: 40px; }
  .prob-filters { margin-bottom: 36px; }
  .prob-pills { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .prob-pills:last-child { margin-bottom: 0; }
  .pill { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 7px 16px; border-radius: 999px; text-decoration: none; background: #fff; color: #4A3F38; border: 1.5px solid rgba(28,20,16,0.12); }
  .pill-domain { padding: 6px 14px; }
  .pill-type-on { background: #1C1410; color: #FAF8F4; border: 1.5px solid #1C1410; }
  .pill-domain-on { background: #2D6A4F; color: #fff; border: 1.5px solid #2D6A4F; }
  .prob-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .pcard-link { text-decoration: none; display: block; height: 100%; }
  .pcard { background: #fff; border: 1.5px solid rgba(28,20,16,0.07); border-radius: 14px; height: 100%; display: flex; flex-direction: column; overflow: hidden; transition: box-shadow 0.2s, transform 0.2s; cursor: pointer; box-sizing: border-box; }
  .pcard:hover { box-shadow: 0 8px 28px rgba(28,20,16,0.10); transform: translateY(-2px); }
  .pcard-thumb { aspect-ratio: 16 / 9; background: #F3EEE7; }
  .pcard-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pcard-body { padding: clamp(20px, 3vw, 28px); display: flex; flex-direction: column; gap: 16px; flex: 1; }
  .pbadges { display: flex; gap: 8px; flex-wrap: wrap; }
  .pbadge { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; }
  .pbadge-domain { color: #2D6A4F; background: #EAF4EE; border: 1px solid rgba(45,106,79,0.15); }
  .pbadge-public { color: #4A3F38; background: rgba(28,20,16,0.05); border: 1px solid rgba(28,20,16,0.1); }
  .pbadge-industry { color: #1E40AF; background: rgba(30,64,175,0.08); border: 1px solid rgba(30,64,175,0.15); }
  .pbadge-diff { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; }
  .pbadge-diff-Beginner { color: #2D6A4F; background: #EAF4EE; border: 1px solid rgba(45,106,79,0.2); }
  .pbadge-diff-Intermediate { color: #B8860B; background: #FFF8E7; border: 1px solid rgba(184,134,11,0.2); }
  .pbadge-diff-Advanced { color: #C53030; background: #FFF0F0; border: 1px solid rgba(197,48,48,0.2); }
  .pbadge-diff-Expert { color: #7C3AED; background: #F3E8FF; border: 1px solid rgba(124,58,237,0.2); }
  .pcard-title { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 600; color: #1C1410; line-height: 1.4; margin: 0; }
  .pcard-snippet { font-family: 'DM Sans', sans-serif; font-size: 13px; color: #4A3F38; font-weight: 300; line-height: 1.6; margin: 0; flex: 1; }
  .pfoot { display: flex; gap: 20px; row-gap: 8px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid rgba(28,20,16,0.06); }
  .pstat { display: flex; flex-direction: column; gap: 2px; }
  .pstat-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; color: #1C1410; }
  .pstat-val-soon { color: #DC2626; }
  .pstat-val-days { color: #F4A723; }
  .pstat-label { font-size: 11px; color: #9CA3A0; text-transform: uppercase; letter-spacing: 0.07em; }
  .pview { margin-left: auto; display: flex; align-items: center; }
  .pview span { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: #2D6A4F; }
  .pempty, .perror { text-align: center; padding: 80px 24px; background: #fff; border-radius: 12px; border: 1.5px solid rgba(28,20,16,0.07); }
  .perror { border: 1.5px solid rgba(220,38,38,0.12); }
  .pempty-ico, .perror-ico { font-size: 40px; margin-bottom: 16px; }
  .perror-ico { font-size: 36px; }
  .pempty-title, .perror-title { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 600; color: #1C1410; margin-bottom: 8px; }
  .pempty-sub, .perror-sub { font-size: 14px; color: #9CA3A0; }
</style>
</head>
<body>
<div id="sn-nav"></div>
<div class="container">
  <div class="prob-page">
    <div class="prob-wrap">
      <div id="msg"></div>
      <div class="prob-head">
        <h1 class="prob-title">Real problems.<br>Waiting for your thinking.</h1>
        <p class="prob-sub" id="count"></p>
      </div>
      <div class="prob-filters">
        <div class="prob-pills" id="type-pills"></div>
        <div class="prob-pills" id="domain-pills"></div>
      </div>
      <div id="list"><div class="prob-grid" role="status" aria-label="Loading problems"><span class="sr-only">Loading…</span>
        <div class="pcard" aria-hidden="true"><div class="pcard-thumb sk"></div><div class="pcard-body"><div class="sk sk-line" style="width:45%"></div><div class="sk" style="height:18px;width:90%"></div><div class="sk sk-line" style="width:100%"></div><div class="sk sk-line" style="width:65%"></div></div></div>
        <div class="pcard" aria-hidden="true"><div class="pcard-thumb sk"></div><div class="pcard-body"><div class="sk sk-line" style="width:40%"></div><div class="sk" style="height:18px;width:85%"></div><div class="sk sk-line" style="width:100%"></div><div class="sk sk-line" style="width:60%"></div></div></div>
        <div class="pcard" aria-hidden="true"><div class="pcard-thumb sk"></div><div class="pcard-body"><div class="sk sk-line" style="width:50%"></div><div class="sk" style="height:18px;width:80%"></div><div class="sk sk-line" style="width:95%"></div><div class="sk sk-line" style="width:70%"></div></div></div>
      </div></div>
    </div>
  </div>
</div>
<script src="/assets/config.js"></script>
<script type="module">
import { api, esc, renderNav, alertBox } from '/assets/app.js';
import { icon } from '/assets/icons.js';
renderNav();
const DOMAINS = ['All','AI & Data','Climate','Public Infrastructure','Healthcare','Agriculture','Education','Urban Mobility','Civic Technology'];
const DOMAIN_ICONS = { 'AI & Data': 'cpu', 'Climate': 'leaf', 'Public Infrastructure': 'wrench', 'Healthcare': 'activity', 'Agriculture': 'wheat', 'Education': 'book', 'Urban Mobility': 'bus', 'Civic Technology': 'landmark' };
const TYPE_ICONS = { 'public_impact': 'globe', 'industry_challenge': 'briefcase' };
const TYPES = [['all','All Types'],['public_impact','Public Impact'],['industry_challenge','Industry Challenge']];
const DIFF_CLASS = { 'Beginner': 'pbadge-diff-Beginner', 'Intermediate': 'pbadge-diff-Intermediate', 'Advanced': 'pbadge-diff-Advanced', 'Expert': 'pbadge-diff-Expert' };
const q = new URLSearchParams(location.search);
const domain = q.get('domain') || 'All';
const type = q.get('type') || 'all';
const link = (d, t) => `/problems?domain=${encodeURIComponent(d)}&type=${encodeURIComponent(t)}`;
document.getElementById('type-pills').innerHTML = TYPES.map(([v, l]) =>
  `<a class="pill ${type === v ? 'pill-type-on' : ''}" href="${link(domain, v)}">${v !== 'all' && TYPE_ICONS[v] ? icon(TYPE_ICONS[v], 14) + ' ' : ''}${esc(l)}</a>`).join('');
document.getElementById('domain-pills').innerHTML = DOMAINS.map(d =>
  `<a class="pill pill-domain ${domain === d ? 'pill-domain-on' : ''}" href="${link(d, type)}">${d !== 'All' && DOMAIN_ICONS[d] ? icon(DOMAIN_ICONS[d], 14) + ' ' : ''}${esc(d)}</a>`).join('');
function daysLeftFor(deadline) {
  return Math.ceil((new Date(deadline).getTime() - Date.now()) / (1000 * 60 * 60 * 24));
}
function card(p, idx = 0) {
  const isIndustry = p.problem_type === 'industry_challenge';
  const days = p.deadline ? daysLeftFor(p.deadline) : null;
  const closed = days != null && !isNaN(days) && days < 0;
  const snippet = (p.context || '').length > 140 ? `${(p.context || '').slice(0, 140)}...` : (p.context || '');
  const dayClass = days == null || isNaN(days) || closed ? 'pstat-val' : (days <= 7 ? 'pstat-val pstat-val-soon' : 'pstat-val pstat-val-days');
  const eager = idx < 2;
  return `<a class="pcard-link" href="/problems/${esc(p.id)}"><div class="pcard">
    ${p.thumbnail_url ? `<div class="pcard-thumb"><img src="${esc(p.thumbnail_url)}" alt="${esc(p.title)} thumbnail" ${eager ? 'loading="eager" fetchpriority="high"' : 'loading="lazy"'} decoding="async"></div>` : ''}
    <div class="pcard-body">
      <div class="pbadges">
        <span class="pbadge pbadge-domain">${DOMAIN_ICONS[p.domain] ? icon(DOMAIN_ICONS[p.domain], 14) + ' ' : ''}${esc(p.domain || '')}</span>
        <span class="pbadge ${isIndustry ? 'pbadge-industry' : 'pbadge-public'}">${isIndustry ? `${icon('briefcase', 14)} ₹${esc((p.reward_amount ?? 0).toLocaleString('en-IN'))}` : `${icon('globe', 14)} Public Impact`}</span>
        ${p.difficulty_label ? `<span class="pbadge pbadge-diff ${DIFF_CLASS[p.difficulty_label] || ''}">${esc(p.difficulty_label)}</span>` : ''}
      </div>
      <h2 class="pcard-title">${esc(p.title)}</h2>
      <p class="pcard-snippet">${esc(snippet)}</p>
      <div class="pfoot">
        <div class="pstat"><span class="${dayClass}">${days == null || isNaN(days) ? '—' : (closed ? 'Closed' : `${days}d`)}</span><span class="pstat-label">${closed ? 'enrollment closed' : 'left'}</span></div>
        <div class="pstat"><span class="pstat-val">${esc(String(p.submission_count ?? 0))}</span><span class="pstat-label">submissions</span></div>
        <div class="pview"><span>View →</span></div>
      </div>
    </div>
  </div></a>`;
}
try {
  const { problems: raw } = await api(`/api/public/problems?domain=${encodeURIComponent(domain)}&type=${encodeURIComponent(type)}`);
  // Safety net: never show deadline-passed problems in the student listing.
  // (Server already filters these; expired items live on as poster "Archived".)
  const nowMs = Date.now();
  const problems = (raw || []).filter((p) => {
    if (!p.deadline) return true;
    const t = new Date(p.deadline).getTime();
    return Number.isNaN(t) || t >= nowMs;
  });
  document.getElementById('count').textContent = `${problems.length} open problems across ${domain === 'All' ? '8 domains' : domain}`;
  document.getElementById('list').innerHTML = problems.length
    ? `<div class="prob-grid">${problems.map((p, i) => card(p, i)).join('')}</div>`
    : `<div class="pempty"><div class="pempty-ico">${icon('search', 44)}</div><div class="pempty-title">No problems found</div><div class="pempty-sub">Try a different domain or type filter.</div></div>`;
} catch (e) {
  document.getElementById('msg').innerHTML = alertBox(e.message);
  document.getElementById('list').innerHTML = `<div class="perror"><div class="perror-ico">${icon('alert', 36)}</div><div class="perror-title">Couldn&apos;t load problems</div><div class="perror-sub">Refresh the page in a moment. If this keeps happening, the server query needs attention.</div></div>`;
}
</script>
</body>
</html>
