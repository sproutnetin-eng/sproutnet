<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Admin | SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .setup-wrap { min-height: 100vh; background: #1C1410; display: flex; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif; padding: 24px; box-sizing: border-box; }
  .setup-card { background: #FAF8F4; border-radius: 16px; padding: 40px; max-width: 440px; width: 100%; text-align: center; box-sizing: border-box; }
  .setup-icon { font-size: 48px; margin-bottom: 16px; }
  .setup-card h1 { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700; color: #1C1410; margin: 0 0 12px; }
  .setup-card p { font-size: 14px; color: #4A3F38; margin: 0 0 24px; line-height: 1.6; }
  .setup-card p:empty { margin: 0; }
  .setup-btn { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; color: #1C1410; background: #F4A723; border: none; border-radius: 8px; padding: 14px 28px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
  .setup-btn-sm { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: #1C1410; border: none; border-radius: 8px; padding: 12px 24px; text-decoration: none; display: inline-block; }
  .setup-btn-sm.amber { background: #F4A723; }
  .setup-btn-sm.mint { background: #EAF4EE; }
  .setup-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="sn-nav"></div>
<div class="setup-wrap">
  <div class="setup-card">
    <div class="setup-icon" id="icon"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:-3px" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
    <h1 id="title">Checking...</h1>
    <p id="desc"></p>
    <div id="actions"></div>
  </div>
</div>
<script src="/assets/config.js"></script>
<script type="module">
import { api, esc, renderNav } from '/assets/app.js';
import { icon as svgIcon } from '/assets/icons.js';
renderNav();
const icon = document.getElementById('icon');
const title = document.getElementById('title');
const desc = document.getElementById('desc');
const actions = document.getElementById('actions');
try {
  const data = await api('/api/admin/seed', { method: 'POST' });
  icon.innerHTML = svgIcon('checkCircle', 44); title.textContent = 'You are now an admin!';
  desc.textContent = data.message || 'Promoted to admin!';
  actions.innerHTML = '<button class="setup-btn" id="go-admin">Go to Admin Panel →</button>';
  document.getElementById('go-admin').addEventListener('click', () => { location.href = '/admin'; });
} catch (err) {
  if (/401|Unauthorized/.test(err.message)) {
    title.textContent = 'Not logged in'; desc.textContent = 'You need to be logged in first.';
    actions.innerHTML = '<div class="setup-actions"><a class="setup-btn-sm amber" href="/join">Sign Up First</a><a class="setup-btn-sm mint" href="/login/student">Log In</a></div>';
  } else {
    icon.innerHTML = svgIcon('xCircle', 44); title.textContent = 'Something went wrong'; desc.textContent = err.message;
    actions.innerHTML = '<a class="setup-btn-sm amber" href="/login/student">Try Logging In First</a>';
  }
}
</script>
</body>
</html>
