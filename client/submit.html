<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit solution | SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
.sub-wrap { max-width: 860px; margin: 0 auto; padding: clamp(28px, 5vw, 44px) clamp(16px, 4vw, 24px); }
.sub-banner { background: #fff; border: 1.5px solid rgba(28,20,16,0.08); border-radius: 18px; padding: 28px 30px; margin-bottom: 32px; box-shadow: 0 4px 20px rgba(28,20,16,0.03); }
.sub-tags { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.sub-tag-sol { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #2D6A4F; background: #EAF4EE; padding: 4px 10px; border-radius: 6px; }
.sub-tag-dom { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #6A5F58; background: #F2EEE8; padding: 4px 10px; border-radius: 6px; }
.sub-banner h1 { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(26px, 5vw, 36px); font-weight: 400; color: #1C1410; letter-spacing: -0.3px; line-height: 1.25; margin: 0 0 10px; }
.sub-meta { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 14px; margin-top: 14px; border-top: 1px solid rgba(28,20,16,0.06); }
.sub-builder { font-size: 13px; color: #4A3F38; }
.sub-prog { display: flex; align-items: center; gap: 12px; flex-grow: 1; max-width: 280px; }
.sub-track { flex-grow: 1; height: 8px; background: #EAE5DC; border-radius: 999px; overflow: hidden; }
.sub-fill { height: 100%; transition: width 0.3s ease; }
.sub-pct { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6A5F58; font-weight: 600; }
.sub-alert-err { background: #FEF2F2; border: 1.5px solid #FCA5A5; border-radius: 12px; padding: 14px 18px; margin-bottom: 28px; display: flex; align-items: flex-start; gap: 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #991B1B; }
.sub-alert-ok { background: #ECFDF5; border: 1.5px solid #6EE7B7; border-radius: 12px; padding: 14px 18px; margin-bottom: 28px; display: flex; align-items: center; gap: 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #065F46; font-weight: 500; }
.sub-alert-sub { background: #ECFDF5; border: 1.5px solid #34D399; border-radius: 12px; padding: 16px 20px; margin-bottom: 28px; display: flex; align-items: center; gap: 12px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: #047857; font-weight: 600; }
.sub-fields-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.sub-fields-head h2 { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; color: #1C1410; margin: 0; }
.sub-fields-head p { font-size: 13px; color: #6A5F58; margin: 2px 0 0; }
.sub-field-grid { display: grid; gap: 24px; margin-bottom: 36px; }
.sub-field { background: #fff; border: 1.5px solid rgba(28,20,16,0.09); border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(28,20,16,0.02); }
.sub-field.done { border-color: rgba(45,106,79,0.25); }
.sub-field-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.sub-field-left { display: flex; align-items: center; gap: 10px; }
.sub-num { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: #F2EEE8; color: #6A5F58; }
.sub-field.done .sub-num { color: #2D6A4F; background: #EAF4EE; }
.sub-field-left h3 { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 600; color: #1C1410; margin: 0; }
.sub-req { font-size: 12px; font-weight: 600; color: #9CA3A0; display: inline-flex; align-items: center; gap: 4px; }
.sub-req.ok { color: #2D6A4F; }
.sub-hint { display: flex; align-items: flex-start; gap: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: #6A5F58; margin-bottom: 12px; line-height: 1.5; }
.sub-editor { border: 1.5px solid rgba(28,20,16,0.14); border-radius: 10px; overflow: hidden; background: #fff; }
.sub-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: #FAF8F4; border-bottom: 1px solid rgba(28,20,16,0.08); gap: 8px; flex-wrap: wrap; }
.sub-toolbar .tb-btns { display: flex; align-items: center; gap: 4px; }
.sub-tb { font-size: 13px; font-weight: 700; color: #1C1410; background: transparent; border: none; border-radius: 4px; padding: 4px 8px; }
.sub-wc { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9CA3A0; font-weight: 500; }
.sub-field textarea.fld { width: 100%; min-height: 120px; max-height: 380px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1C1410; background: transparent; padding: 14px 16px; outline: none; box-sizing: border-box; line-height: 1.65; border: none; resize: vertical; }
.sub-upload { border-radius: 14px; padding: 24px 26px; margin-bottom: 36px; border: 1.5px solid; }
.sub-upload.locked { background: #FFFBEB; border-color: #FCD34D; box-shadow: 0 2px 10px rgba(245,158,11,0.08); }
.sub-upload.unlocked { background: #fff; border-color: rgba(45,106,79,0.3); box-shadow: 0 4px 16px rgba(45,106,79,0.05); }
.sub-upload-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.sub-upload-title { display: flex; align-items: center; gap: 10px; }
.sub-upload-title h3 { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 600; color: #1C1410; margin: 0; }
.sub-lockpill { display: inline-flex; align-items: center; gap: 6px; font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 20px; border: 1.5px solid; }
.sub-lockpill.locked { color: #B45309; background: #FEF3C7; border-color: #FCD34D; }
.sub-lockpill.unlocked { color: #2D6A4F; background: #EAF4EE; border-color: #6EE7B7; }
.sub-locknote { background: #FEF3C7; border: 1.5px solid #FCD34D; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #92400E; font-weight: 600; }
.sub-upload p.desc { font-size: 13px; color: #6A5F58; margin-bottom: 16px; line-height: 1.6; }
.sub-upload input[type=file] { width: 100%; font-family: 'DM Sans', sans-serif; font-size: 14px; border-radius: 10px; padding: 14px 16px; outline: none; box-sizing: border-box; border: 1.5px dashed; }
.sub-upload input[type=file].locked { color: #9CA3A0; background: #F3F0E8; border-color: rgba(180,83,9,0.3); cursor: not-allowed; }
.sub-upload input[type=file].unlocked { color: #1C1410; background: #FAF8F4; border-color: rgba(45,106,79,0.35); cursor: pointer; }
.sub-filemeta { font-size: 12px; margin-top: 10px; font-weight: 500; }
.sub-files { display: grid; gap: 10px; margin-top: 18px; }
.sub-file { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: #FAF8F4; border-radius: 10px; border: 1px solid rgba(45,106,79,0.18); flex-wrap: wrap; }
.sub-file a { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: #2D6A4F; text-decoration: none; }
.sub-file .rm { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; color: #DC2626; background: #fff; border: 1px solid rgba(220,38,38,0.2); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.sub-bar { position: sticky; bottom: clamp(10px, 2vw, 20px); background: #fff; border: 1.5px solid rgba(28,20,16,0.1); border-radius: 16px; padding: 14px clamp(14px, 3vw, 24px); box-shadow: 0 10px 30px rgba(28,20,16,0.08); z-index: 90; }
.sub-bar-in { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; row-gap: 10px; }
.sub-rem { font-size: 13px; color: #6A5F58; flex: 1 1 180px; }
.sub-rem.ok { color: #2D6A4F; font-weight: 500; }
.sub-btns { display: flex; gap: 10px; align-items: center; flex: 1 1 auto; justify-content: flex-end; max-width: 100%; }
.btn-draft { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: #1C1410; background: #F6F2EB; border: 1.5px solid rgba(28,20,16,0.12); border-radius: 8px; padding: 11px clamp(12px, 2vw, 20px); cursor: pointer; white-space: nowrap; }
.btn-submit { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: #1C1410; background: #F4A723; border: none; border-radius: 8px; padding: 11px clamp(14px, 3vw, 24px); cursor: pointer; box-shadow: 0 2px 10px rgba(244,167,35,0.3); white-space: nowrap; flex: 1 1 auto; text-align: center; min-width: 140px; }
.btn-draft:disabled, .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
</style>
</head>
<body>
<div id="sn-nav"></div>
<div class="sub-wrap">
  <div id="msg"></div>
  <div id="content"><p style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#9CA3A0">Loading solution workspace...</p></div>
</div>
<script src="/assets/config.js"></script>
<script type="module">
import { sb, api, esc, requireRole, renderNav, alertBox } from '/assets/app.js';
renderNav();
const msg = document.getElementById('msg');
const content = document.getElementById('content');
const problemId = location.pathname.split('/')[2];

const FIELDS = [
  ['f_understanding', 'Problem Understanding', 'In your own words, what is the core problem? Who does it affect and how? What evidence do you have that this is real?', 'Be specific. Avoid restating the problem brief — show you understand it.'],
  ['f_solution', 'Proposed Solution', 'What is your solution? Describe it clearly enough that someone unfamiliar could understand it in 2 minutes.', 'Focus on the core idea first, not implementation details.'],
  ['f_impact', 'Expected Impact', 'If your solution works, what changes? Who benefits? By how much? Can you quantify the impact?', 'Use numbers where possible. "Reduces X by Y%" is stronger than "improves X".'],
  ['f_rootcause', 'Root Cause Analysis', 'Why does this problem exist? What are the underlying causes — not just symptoms?', 'Surface-level causes lead to surface-level solutions. Go deeper.'],
  ['f_feasibility', 'Feasibility Assessment', 'Is your solution technically, economically, and socially feasible? What resources would be needed?', "Be honest about what you don't know. Acknowledging uncertainty is strength."],
  ['f_risks', 'Risks & Limitations', 'What could go wrong? What are the biggest risks to your solution?', 'Every solution has risks. The best submissions name them honestly.'],
  ['f_implementation', 'Implementation Plan', 'How would this actually get built and deployed? What are the key steps and timeline?', "Think in phases. What's the MVP? What comes after?"],
];
const plain = (s) => (s || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
const ACCEPT = '.pdf,.doc,.docx,.xls,.xlsx,.csv,.zip,.png,.jpg,.jpeg,.webp,.gif';

const me = await requireRole('student');
if (!me) throw new Error('redirect');
try {
  const ctx = await api(`/api/student/submit-context?problem_id=${encodeURIComponent(problemId)}`);
  const { problem, profile, submission } = ctx;
  const vals = {
    f_understanding: submission?.f_understanding || '', f_solution: submission?.f_solution || '',
    f_impact: submission?.f_impact || '', f_rootcause: submission?.f_rootcause || '',
    f_feasibility: submission?.f_feasibility || '', f_risks: submission?.f_risks || '',
    f_implementation: submission?.f_implementation || '',
  };
  let files = [];
  try {
    const parsed = JSON.parse(vals.f_implementation || 'null');
    if (parsed && Array.isArray(parsed.files)) { files = parsed.files; vals.f_implementation = parsed.text || ''; }
  } catch { /* plain text */ }
  let participantType = submission?.participant_type === 'team' ? 'team' : (problem?.team_mode === 'team' ? 'team' : 'individual');
  const subId = submission?.id || null;
  const done = () => FIELDS.filter(([k]) => plain(document.getElementById('fld-' + k).value)).length;

  content.innerHTML = `
    <div class="sub-banner">
      <div class="sub-tags"><span class="sub-tag-sol">Solution Workspace</span>${problem?.domain ? `<span class="sub-tag-dom">${esc(problem.domain)}</span>` : ''}</div>
      <h1>${esc(problem?.title || 'Solution')}</h1>
      <div class="sub-meta">
        <div class="sub-builder"><strong>Builder:</strong> ${esc(profile.name)}${profile.dept ? ` (${esc(profile.dept)} · ${esc(profile.year || '')})` : ''}</div>
        <div class="sub-prog"><div class="sub-track"><div class="sub-fill" id="pfill"></div></div><span class="sub-pct" id="ppct"></span></div>
      </div>
    </div>
    <div id="errbox"></div>
    <div class="sub-fields-head"><div><h2>7-Field Solution Framework</h2><p>Complete all seven fields to provide a structured, defensible solution proposal.</p></div></div>
    <div class="sub-field-grid">
      ${FIELDS.map(([k, label, ph, hint], i) => `
        <div class="sub-field" id="wrap-${k}">
          <div class="sub-field-top"><div class="sub-field-left"><span class="sub-num">Field ${i + 1} of 7</span><h3>${label}</h3></div><span class="sub-req" id="req-${k}">Required</span></div>
          <div class="sub-hint"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6A5F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg><span>${esc(hint)}</span></div>
          <div class="sub-editor">
            <div class="sub-toolbar"><div class="tb-btns"><span class="sub-tb" style="font-family:Sora,sans-serif;font-weight:800">B</span><span class="sub-tb" style="font-family:Georgia,serif;font-style:italic">I</span><span class="sub-tb" style="text-decoration:underline">U</span><span class="sub-tb" style="font-size:12px;color:#4A3F38">≡ List</span><span class="sub-tb" style="font-family:Georgia,serif">“ Quote</span></div><div class="sub-wc" id="wc-${k}">0 words</div></div>
            <textarea class="fld" id="fld-${k}" placeholder="${esc(ph)}">${esc(vals[k])}</textarea>
          </div>
        </div>`).join('')}
    </div>
    <div class="sub-upload locked" id="upanel">
      <div class="sub-upload-head">
        <div class="sub-upload-title"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg><h3>Upload PDF &amp; Supporting Evidence</h3></div>
        <div class="sub-lockpill locked" id="lockpill">LOCKED — Fill All 7 Fields</div>
      </div>
      <div class="sub-locknote" id="locknote"><span>File upload is currently locked. Complete all 7 solution fields above to enable PDF uploads.</span></div>
      <p class="desc" id="updesc">Complete all 7 framework fields above to unlock uploading PDF reports and supporting documents.</p>
      <input type="file" id="upfile" class="locked" accept="${ACCEPT}">
      <div class="sub-filemeta" id="filemeta"></div>
      <div class="sub-files" id="filelist"></div>
    </div>
    <div class="sub-bar"><div class="sub-bar-in">
      <div class="sub-rem" id="remaining"></div>
      <div class="sub-btns"><button class="btn-draft" id="draft">Save Draft</button><button class="btn-submit" id="submit">Submit Solution →</button></div>
    </div></div>`;

  const wc = (s) => { const t = (s || '').trim(); return t ? t.split(/\s+/).filter(Boolean).length : 0; };
  const renderFiles = () => {
    const list = document.getElementById('filelist');
    list.innerHTML = files.map(f => `<div class="sub-file"><div style="display:flex;align-items:center;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2D6A4F" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg><a href="${esc(f.url)}" target="_blank" rel="noreferrer">${esc(f.name)}</a></div><button class="rm" data-rm="${esc(f.url)}">Remove</button></div>`).join('');
    list.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { files = files.filter(x => x.url !== b.dataset.rm); refresh(); }));
  };
  const refresh = () => {
    const d = done();
    const pct = Math.round(d / 7 * 100);
    const fill = document.getElementById('pfill');
    fill.style.width = pct + '%';
    fill.style.background = d === 7 ? '#2D6A4F' : '#F4A723';
    document.getElementById('ppct').textContent = pct + '%';
    const rem = document.getElementById('remaining');
    if (d === 7) { rem.className = 'sub-rem ok'; rem.innerHTML = '✓ All 7 fields completed.'; }
    else { rem.className = 'sub-rem'; rem.textContent = `${7 - d} field(s) remaining.`; }
    const all = d === 7;
    const panel = document.getElementById('upanel');
    panel.className = 'sub-upload ' + (all ? 'unlocked' : 'locked');
    const pill = document.getElementById('lockpill');
    pill.className = 'sub-lockpill ' + (all ? 'unlocked' : 'locked');
    pill.textContent = all ? 'Unlocked for Upload' : 'LOCKED — Fill All 7 Fields';
    document.getElementById('locknote').style.display = all ? 'none' : '';
    document.getElementById('updesc').textContent = all ? 'Attach your detailed PDF report, presentation slides, diagrams, or dataset spreadsheets to accompany your submission.' : 'Complete all 7 framework fields above to unlock uploading PDF reports and supporting documents.';
    const up = document.getElementById('upfile');
    up.className = all ? 'unlocked' : 'locked';
    up.disabled = !all;
    document.getElementById('filemeta').textContent = all ? `${files.length} file(s) attached.` : `PDF file upload is locked until fields 1 through 7 are completed.`;
    FIELDS.forEach(([k]) => {
      const v = document.getElementById('fld-' + k).value;
      const filled = plain(v).length > 0;
      document.getElementById('wrap-' + k).classList.toggle('done', filled);
      const req = document.getElementById('req-' + k);
      req.className = 'sub-req' + (filled ? ' ok' : '');
      req.textContent = filled ? '✓ Completed' : 'Required';
      document.getElementById('wc-' + k).textContent = wc(v) + ' words';
    });
    renderFiles();
  };
  FIELDS.forEach(([k]) => document.getElementById('fld-' + k).addEventListener('input', refresh));
  refresh();

  document.getElementById('upfile').addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (done() < 7) { msg.innerHTML = alertBox('Please complete all 7 solution fields above before uploading supporting documents.'); e.target.value = ''; return; }
    if (file.size > 15 * 1024 * 1024) { msg.innerHTML = alertBox('Files must be 15 MB or smaller.'); e.target.value = ''; return; }
    msg.innerHTML = '';
    try {
      const form = new FormData();
      form.append('problem_id', problemId);
      form.append('file', file);
      const data = await api('/api/submissions/progress-upload', { method: 'POST', form });
      if (data.url && data.name) files.push({ name: data.name, url: data.url });
      refresh();
    } catch (err) { msg.innerHTML = alertBox(err.message); }
    e.target.value = '';
  });

  const collect = () => {
    const v = {};
    FIELDS.forEach(([k]) => v[k] = document.getElementById('fld-' + k).value);
    v.f_implementation = files.length ? JSON.stringify({ text: v.f_implementation, files }) : v.f_implementation;
    return v;
  };
  async function persist(stage, status, btn, label) {
    btn.disabled = true; btn.textContent = 'Saving...'; msg.innerHTML = '';
    try {
      const v = collect();
      const payload = { problem_id: problemId, student_id: profile.id, milestone: 1, total_milestones: 1, dept: profile.dept || 'Unknown', year: profile.year || 'Unknown', stage, status, ...v, participant_type: participantType };
      const supabase = sb();
      if (subId) {
        const { error } = await supabase.from('submissions').update(payload).eq('id', subId);
        if (error) throw error;
      } else {
        const { data, error } = await supabase.from('submissions').insert(payload).select().single();
        if (error) throw error;
      }
      const ok = stage === 'draft' ? 'Draft saved successfully! You can return to edit and submit at any time.' : 'Solution submitted for judging! Redirecting to your dashboard...';
      document.getElementById('errbox').innerHTML = `<div class="sub-alert-ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg><div>${esc(ok)}</div></div>`;
      if (stage === 'full') setTimeout(() => location.href = '/dashboard', 1500);
    } catch (err) { document.getElementById('errbox').innerHTML = `<div class="sub-alert-err"><div>${esc(err.message)}</div></div>`; }
    btn.disabled = false; btn.textContent = label;
  }
  document.getElementById('draft').addEventListener('click', (e) => persist('draft', 'draft', e.target, 'Save Draft'));
  document.getElementById('submit').addEventListener('click', (e) => {
    const missing = FIELDS.filter(([k]) => !plain(document.getElementById('fld-' + k).value));
    if (missing.length) { document.getElementById('errbox').innerHTML = `<div class="sub-alert-err"><div>Please complete all 7 fields before submitting your solution.</div></div>`; return; }
    persist('full', 'pending', e.target, 'Submit Solution →');
  });
} catch (err) {
  if (err.message !== 'redirect') { msg.innerHTML = alertBox(err.message); content.innerHTML = ''; }
}
</script>
</body>
</html>
