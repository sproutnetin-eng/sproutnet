<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team workspace | SproutNet</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
.ws-wrap { max-width: 1200px; margin: 32px auto; padding: 0 20px; }
.ws-head { background: #fff; border: 1.5px solid rgba(28,20,16,0.08); border-radius: 16px; padding: 28px; margin-bottom: 28px; }
.ws-head-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; }
.ws-dom { font-size: 12px; color: #2D6A4F; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.ws-head h1 { font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; color: #1C1410; margin: 4px 0 8px; }
.ws-prob { font-size: 15px; color: #4A3F38; margin: 0; }
.ws-invite { background: #FAF8F4; border: 1px solid rgba(28,20,16,0.12); border-radius: 12px; padding: 14px 18px; text-align: right; }
.ws-invite .l { font-size: 11px; color: #9CA3A0; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.ws-invite .c { display: flex; align-items: center; gap: 8px; }
.ws-invite code { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: #2D6A4F; }
.btn-copy { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; color: #1C1410; background: #F4A723; border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.team-layout { display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
.team-chat { min-height: 400px; }
@media (max-width: 768px) { .team-layout { grid-template-columns: 1fr; } .team-chat { min-height: 300px; } }
.ws-col { display: flex; flex-direction: column; gap: 24px; }
.ws-card { background: #fff; border: 1.5px solid rgba(28,20,16,0.08); border-radius: 14px; padding: 20px; }
.ws-card h3 { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; color: #1C1410; margin: 0; }
.ws-card h3.sm { font-size: 15px; }
.ws-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.member-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #FAF8F4; border-radius: 8px; margin-bottom: 10px; }
.member-row .n { font-size: 14px; font-weight: 600; color: #1C1410; }
.member-row .e { font-size: 12px; color: #9CA3A0; }
.role-pill { font-size: 10px; font-family: 'JetBrains Mono', monospace; padding: 3px 8px; border-radius: 999px; background: rgba(28,20,16,0.08); color: #1C1410; font-weight: 600; }
.role-pill.leader { background: #F4A723; }
.btn-req { font-size: 12px; font-weight: 600; color: #2D6A4F; background: #EAF4EE; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.mentor-box { padding: 10px; background: #FAF8F4; border-radius: 8px; border: 1px solid rgba(45,106,79,0.15); margin-bottom: 10px; }
.mentor-box .n { font-size: 14px; font-weight: 600; color: #2D6A4F; }
.mentor-box .e { font-size: 12px; color: #4A3F38; margin-top: 2px; }
.ws-muted { font-size: 13px; color: #9CA3A0; text-align: center; padding: 12px; }
.act-row { font-size: 12px; color: #4A3F38; border-bottom: 1px dashed rgba(28,20,16,0.08); padding-bottom: 6px; margin-bottom: 10px; }
.act-row .t { font-size: 10px; color: #9CA3A0; margin-top: 2px; }
.ws-card input.in, .ws-card select.in, .ws-card textarea.in { font-family: 'DM Sans', sans-serif; font-size: 13px; color: #1C1410; background: #FAF8F4; border: 1.5px solid rgba(28,20,16,0.12); border-radius: 8px; padding: 9px 12px; outline: none; width: 100%; box-sizing: border-box; }
.ws-mini-row { display: flex; gap: 8px; margin-top: 10px; }
.ws-mini-row .in { flex: 1; }
.btn-mini { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; color: #1C1410; background: #F4A723; border: none; border-radius: 8px; padding: 9px 14px; cursor: pointer; white-space: nowrap; }
.btn-ghost { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; color: #2D6A4F; background: #EAF4EE; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.btn-danger-sm { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; color: #DC2626; background: #fff; border: 1px solid rgba(220,38,38,0.25); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.ws-sec-label { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: #1C1410; margin: 14px 0 6px; }
/* Realtime chat — mirrors realtime-chat.tsx */
.chat-box { display: flex; flex-direction: column; height: 100%; min-height: 480px; background: #fff; border-radius: 14px; border: 1.5px solid rgba(28,20,16,0.08); overflow: hidden; }
.chat-top { padding: 12px 18px; background: #FAF8F4; border-bottom: 1px solid rgba(28,20,16,0.07); display: flex; justify-content: space-between; align-items: center; }
.chat-top .t { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700; color: #1C1410; }
.chat-top input { font-family: 'DM Sans', sans-serif; font-size: 13px; background: #fff; border: 1px solid rgba(28,20,16,0.12); border-radius: 6px; padding: 5px 10px; width: 180px; }
#chatlog { flex: 1; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; max-height: 520px; }
.msg-col { display: flex; flex-direction: column; }
.msg-col.mine { align-items: flex-end; }
.msg-col.theirs { align-items: flex-start; }
.msg-meta { font-size: 11px; color: #9CA3A0; margin-bottom: 2px; }
.bubble { max-width: 78%; padding: 10px 14px; font-size: 14px; line-height: 1.4; }
.bubble.mine { background: #2D6A4F; color: #fff; border-radius: 14px 14px 2px 14px; }
.bubble.theirs { background: #FAF8F4; color: #1C1410; border: 1.5px solid rgba(28,20,16,0.07); border-radius: 14px 14px 14px 2px; }
.bubble .replyq { font-size: 12px; opacity: 0.8; border-left: 2px solid rgba(255,255,255,0.4); padding-left: 6px; margin-bottom: 4px; }
.bubble a { color: #F4A723; }
.bubble.theirs a { color: #2D6A4F; }
.msg-actions { display: flex; gap: 4px; margin-top: 4px; align-items: center; flex-wrap: wrap; }
.msg-actions button { background: none; border: none; cursor: pointer; font-size: 11px; color: #9CA3A0; padding: 2px 6px; }
.typing-bar { padding: 4px 18px; font-size: 12px; color: #2D6A4F; font-style: italic; background: #FAF8F4; min-height: 18px; }
.reply-bar { padding: 6px 18px; background: #EAF4EE; font-size: 12px; color: #2D6A4F; display: flex; justify-content: space-between; align-items: center; }
.chat-form { padding: 12px 18px; background: #FAF8F4; border-top: 1px solid rgba(28,20,16,0.07); display: flex; gap: 10px; align-items: center; }
.chat-form input[type=text] { flex: 1; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1C1410; background: #fff; border: 1.5px solid rgba(28,20,16,0.12); border-radius: 8px; padding: 10px 14px; outline: none; }
.btn-send { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: #1C1410; background: #F4A723; border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
.clip { cursor: pointer; font-size: 18px; opacity: 0.7; }
/* Mentor modal */
.modal-bg { position: fixed; inset: 0; background: rgba(28,20,16,0.4); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal-card { width: min(480px, 92vw); background: #fff; border-radius: 16px; padding: 28px; border: 1.5px solid rgba(28,20,16,0.08); }
.modal-card h2 { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700; color: #1C1410; margin: 0 0 8px; }
.modal-card .d { font-size: 14px; color: #4A3F38; margin-bottom: 20px; }
.modal-card form { display: flex; flex-direction: column; gap: 16px; }
.modal-card label { font-size: 13px; font-weight: 500; color: #1C1410; display: flex; flex-direction: column; gap: 6px; }
.modal-card select, .modal-card textarea { font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 10px; border: 1.5px solid rgba(28,20,16,0.12); border-radius: 8px; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
.btn-cancel-m { padding: 9px 16px; background: #fff; border: 1px solid rgba(28,20,16,0.12); border-radius: 8px; cursor: pointer; }
.btn-send-m { padding: 9px 18px; background: #F4A723; border: none; border-radius: 8px; font-weight: 600; color: #1C1410; cursor: pointer; }
</style>
</head>
<body>
<div id="sn-nav"></div>
<div class="ws-wrap">
  <div id="msg"></div>
  <div id="content"><p style="font-size:14px;color:#9CA3A0">Loading workspace...</p></div>
</div>
<script src="/assets/config.js"></script>
<script type="module">
import { sb, api, esc, requireAuth, renderNav, alertBox } from '/assets/app.js';
renderNav();
const msg = document.getElementById('msg');
const content = document.getElementById('content');
const teamId = location.pathname.split('/')[2];

const s = await requireAuth();
if (s) {
  try {
    const d = await api(`/api/student/teams/${encodeURIComponent(teamId)}`);
    const { team, currentUserId, isLeader, isMentor, isAdmin } = d;
    const ws = d.workspace;
    const wsId = ws?.id || null;

    let channels = [], milestones = [], files = [], announcements = [], activity = d.activityLogs || [], members = [];
    async function loadWs() {
      if (!wsId) return;
      try {
        const [c, m, f, a, act, mem] = await Promise.all([
          api(`/api/workspaces/${wsId}/channels`).catch(() => ({ channels: [] })),
          api(`/api/workspaces/${wsId}/milestones`).catch(() => ({ milestones: [] })),
          api(`/api/workspaces/${wsId}/files`).catch(() => ({ files: [] })),
          api(`/api/workspaces/${wsId}/announcements`).catch(() => ({ announcements: [] })),
          api(`/api/workspaces/${wsId}/activity`).catch(() => ({ logs: d.activityLogs || [] })),
          api(`/api/workspaces/${wsId}/members`).catch(() => ({ members: d.members || [] })),
        ]);
        channels = c.channels || []; milestones = m.milestones || [];
        files = f.files || []; announcements = a.announcements || [];
        activity = act.logs || act.activity || d.activityLogs || [];
        members = mem.members || d.members || [];
      } catch { /* keep defaults */ }
    }
    await loadWs();
    const memberList = members.length ? members : (d.members || []);

    content.innerHTML = `
      <div class="ws-head">
        <div class="ws-head-top">
          <div>
            <div class="ws-dom">${esc(team.problems?.domain || '')} · Problem Challenge</div>
            <h1>${esc(team.name)}</h1>
            <p class="ws-prob">Problem: <strong>${esc(team.problems?.title || '')}</strong></p>
          </div>
          <div class="ws-invite">
            <div class="l">Team Invite Code</div>
            <div class="c"><code>${esc(team.invite_code || '')}</code><button class="btn-copy" id="copy">Copy</button></div>
          </div>
        </div>
      </div>
      <div class="team-layout">
        <div class="ws-col">
          <div class="ws-card">
            <div class="ws-card-head"><h3>Members (${memberList.length}/${team.problems?.max_team_size || 4})</h3></div>
            ${memberList.map(m => `
              <div class="member-row"><div><div class="n">${esc(m.users?.name || m.name || '')}</div><div class="e">${esc(m.users?.email || m.email || '')}</div></div>
              <span class="role-pill ${m.role === 'leader' ? 'leader' : ''}">${esc(m.role || '')}</span></div>`).join('')}
            ${(isLeader || isAdmin) && wsId ? `
              <div class="ws-sec-label">Invite by email</div>
              <div class="ws-mini-row"><input class="in" id="invemail" placeholder="teammate@jyothyit.ac.in"><button class="btn-ghost" id="invitebtn">Invite</button></div>
              <div class="ws-sec-label">Transfer leadership</div>
              <div class="ws-mini-row"><select class="in" id="newleader">${(d.members || []).filter(m => m.user_id !== currentUserId).map(m => `<option value="${esc(m.user_id)}">${esc(m.users?.name || '')}</option>`).join('')}</select><button class="btn-ghost" id="transferbtn">Transfer</button></div>
              <div class="ws-sec-label">Remove member</div>
              <div class="ws-mini-row"><select class="in" id="rmmember">${(d.members || []).filter(m => m.user_id !== currentUserId).map(m => `<option value="${esc(m.user_id)}">${esc(m.users?.name || '')}</option>`).join('')}</select><button class="btn-danger-sm" id="rmbtn">Remove</button></div>` : ''}
            ${wsId ? `<div class="ws-mini-row"><button class="btn-danger-sm" id="leavebtn">Leave workspace</button></div>` : ''}
          </div>
          <div class="ws-card">
            <div class="ws-card-head"><h3>Assigned Mentors</h3>${(isLeader || isAdmin) ? '<button class="btn-req" id="mentorbtn">+ Request Mentor</button>' : ''}</div>
            ${(d.assignedMentors || []).length ? d.assignedMentors.map(a => `<div class="mentor-box"><div class="n">🛡️ ${esc(a.users?.name || '')}</div><div class="e">${esc(a.users?.email || '')}</div></div>`).join('') : '<div class="ws-muted">No mentor assigned yet.</div>'}
            <div id="mentorform" style="display:none">
              <label class="ws-sec-label">Mentor</label>
              <select class="in" id="mentorid"><option value="">-- Choose a mentor --</option>${(d.availableMentors || []).map(m => `<option value="${esc(m.user_id)}">${esc(m.users?.name || '')} (${esc((m.skills || []).join(', ') || 'General Expert')})</option>`).join('')}</select>
              <label class="ws-sec-label">Message</label>
              <textarea class="in" id="mentorreqmsg" rows="3" placeholder="Introduce your team and explain what guidance you need..."></textarea>
              <div class="ws-mini-row"><button class="btn-mini" id="mentorsend">Send Request →</button></div>
            </div>
            ${isAdmin && wsId && d.availableMentors ? `<div class="ws-sec-label">Assign mentor directly</div><div class="ws-mini-row"><select class="in" id="directmentor">${(d.availableMentors || []).map(m => `<option value="${esc(m.user_id)}">${esc(m.users?.name || '')}</option>`).join('')}</select><button class="btn-ghost" id="directmentorbtn">Assign</button></div>` : ''}
          </div>
          ${wsId ? `
          <div class="ws-card"><div class="ws-card-head"><h3 class="sm">Channels</h3></div>
            <div>${channels.map(c => `<div style="font-size:13px;color:#4A3F38;padding:4px 0">#${esc(c.name)}</div>`).join('') || '<div class="ws-muted">No channels yet.</div>'}</div>
            ${(isLeader || isAdmin) ? `<div class="ws-mini-row"><input class="in" id="chname" placeholder="new-channel"><button class="btn-ghost" id="chbtn">Create</button></div>` : ''}
          </div>
          <div class="ws-card"><div class="ws-card-head"><h3 class="sm">Milestones</h3></div>
            <div>${milestones.map(m => `<div class="member-row"><span style="font-size:13px"><strong>${esc(m.title)}</strong> · ${esc(m.status || 'open')}</span>${(isLeader || isAdmin) ? `<button class="btn-ghost" data-ms="${esc(m.id)}" data-st="${m.status === 'completed' ? 'open' : 'completed'}">${m.status === 'completed' ? 'Reopen' : 'Complete'}</button>` : ''}</div>`).join('') || '<div class="ws-muted">No milestones yet.</div>'}</div>
            ${(isLeader || isAdmin) ? `<div class="ws-mini-row"><input class="in" id="mstitle" placeholder="Milestone title"><button class="btn-ghost" id="msbtn">Add</button></div>` : ''}
          </div>
          <div class="ws-card"><div class="ws-card-head"><h3 class="sm">Files</h3></div>
            <div>${files.map(f => `<div style="font-size:13px;padding:4px 0"><a style="color:#2D6A4F;font-weight:600;text-decoration:none" href="${esc(f.file_url || f.url || '#')}" target="_blank" rel="noreferrer">📎 ${esc(f.file_name || f.name || 'file')}</a></div>`).join('') || '<div class="ws-muted">No files yet.</div>'}</div>
            <input class="in" type="file" id="wsfile" style="margin-top:10px">
          </div>
          <div class="ws-card"><div class="ws-card-head"><h3 class="sm">Announcements</h3></div>
            <div>${announcements.map(a => `<div style="margin-bottom:10px"><div style="font-size:13px;font-weight:700">${esc(a.title)}</div><div style="font-size:13px;color:#4A3F38">${esc(a.content)}</div>${(isLeader || isAdmin) ? `<button class="btn-danger-sm" data-ann="${esc(a.id)}" style="margin-top:6px">Delete</button>` : ''}</div>`).join('') || '<div class="ws-muted">No announcements.</div>'}</div>
            ${(isLeader || isAdmin) ? `<label class="ws-sec-label">Title</label><input class="in" id="anntitle"><label class="ws-sec-label">Content</label><textarea class="in" id="annbody"></textarea><div class="ws-mini-row"><button class="btn-ghost" id="annbtn">Post announcement</button></div>` : ''}
          </div>` : '<div class="ws-card"><div class="ws-muted">Workspace is being set up — chat and workspace tools will appear shortly.</div></div>'}
          <div class="ws-card">
            <div class="ws-card-head"><h3 class="sm">Workspace Activity</h3></div>
            ${activity.length ? activity.map(l => `<div class="act-row"><div>${esc(l.description || '')}</div><div class="t">${l.created_at ? new Date(l.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}</div></div>`).join('') : '<div class="ws-muted" style="font-size:12px">No recent activity.</div>'}
          </div>
        </div>
        <div class="team-chat">
          <div class="chat-box">
            <div class="chat-top"><div class="t">Realtime Chat</div><input id="search" placeholder="Search messages..."></div>
            <div id="chatlog"><p style="text-align:center;color:#9CA3A0;font-size:14px;margin:auto">Loading chat history...</p></div>
            <div class="typing-bar" id="typing"></div>
            <div class="reply-bar" id="replybar" style="display:none"></div>
            <form class="chat-form" id="chatform">
              <label class="clip" title="Upload file">📎<input type="file" id="chatfile" style="display:none"></label>
              <input type="text" id="chatinput" placeholder="Type a message... (Press Enter to send)">
              <button class="btn-send" type="submit">Send →</button>
            </form>
          </div>
        </div>
      </div>
      <div id="modal"></div>`;

    document.getElementById('copy')?.addEventListener('click', (e) => { navigator.clipboard.writeText(team.invite_code || ''); e.target.textContent = 'Copied! ✓'; setTimeout(() => e.target.textContent = 'Copy', 2000); });
    document.getElementById('mentorbtn')?.addEventListener('click', () => {
      const f = document.getElementById('mentorform'); f.style.display = f.style.display === 'none' ? '' : 'none';
    });
    document.getElementById('mentorsend')?.addEventListener('click', async (e) => {
      const btn = e.target;
      const mentorId = document.getElementById('mentorid').value;
      if (!mentorId) return;
      btn.disabled = true; btn.textContent = 'Sending...';
      try {
        await api('/api/teams/request-mentor', { method: 'POST', body: { teamId: team.id, mentorId, message: document.getElementById('mentorreqmsg').value } });
        msg.innerHTML = alertBox('Mentorship request sent successfully!', true);
        document.getElementById('modal').innerHTML = '';
      } catch (err) { msg.innerHTML = alertBox(err.message); }
      btn.disabled = false; btn.textContent = 'Send Request →';
    });

    const refresh = () => location.reload();
    if (wsId) {
      document.getElementById('directmentorbtn')?.addEventListener('click', async () => {
        const mentor_id = document.getElementById('directmentor').value;
        if (!mentor_id) return;
        try { await api(`/api/workspaces/${wsId}/mentors`, { method: 'POST', body: { mentor_id } }); refresh(); }
        catch (err) { msg.innerHTML = alertBox(err.message); }
      });
      document.getElementById('invitebtn')?.addEventListener('click', async () => {
        try { await api(`/api/workspaces/${wsId}/invites`, { method: 'POST', body: { email: document.getElementById('invemail').value } }); msg.innerHTML = alertBox('Invite sent!', true); }
        catch (err) { msg.innerHTML = alertBox(err.message); }
      });
      document.getElementById('transferbtn')?.addEventListener('click', async () => {
        const nl = document.getElementById('newleader').value;
        if (!nl || !confirm('Transfer leadership to this member?')) return;
        try { await api(`/api/workspaces/${wsId}/transfer`, { method: 'POST', body: { new_leader_id: nl } }); refresh(); }
        catch (err) { msg.innerHTML = alertBox(err.message); }
      });
      document.getElementById('rmbtn')?.addEventListener('click', async () => {
        const u = document.getElementById('rmmember').value;
        if (!u || !confirm('Remove this member?')) return;
        try { await api(`/api/workspaces/${wsId}/members/${u}`, { method: 'DELETE' }); refresh(); }
        catch (err) { msg.innerHTML = alertBox(err.message); }
      });
      document.getElementById('leavebtn')?.addEventListener('click', async () => {
        if (!confirm('Leave this workspace?')) return;
        try { await api(`/api/workspaces/${wsId}/leave`, { method: 'POST' }); location.href = '/teams'; }
        catch (err) { msg.innerHTML = alertBox(err.message); }
      });
      document.getElementById('chbtn')?.addEventListener('click', async () => {
        const name = document.getElementById('chname').value.trim();
        if (!name) return;
        try { await api(`/api/workspaces/${wsId}/channels`, { method: 'POST', body: { name } }); refresh(); }
        catch (err) { msg.innerHTML = alertBox(err.message); }
      });
      document.getElementById('msbtn')?.addEventListener('click', async () => {
        const title = document.getElementById('mstitle').value.trim();
        if (!title) return;
        try { await api(`/api/workspaces/${wsId}/milestones`, { method: 'POST', body: { title } }); refresh(); }
        catch (err) { msg.innerHTML = alertBox(err.message); }
      });
      document.querySelectorAll('[data-ms]').forEach(b => b.addEventListener('click', async () => {
        try { await api(`/api/workspaces/${wsId}/milestones/${b.dataset.ms}`, { method: 'PATCH', body: { status: b.dataset.st } }); refresh(); }
        catch (err) { msg.innerHTML = alertBox(err.message); }
      }));
      document.getElementById('annbtn')?.addEventListener('click', async () => {
        try {
          await api(`/api/workspaces/${wsId}/announcements`, { method: 'POST', body: { title: document.getElementById('anntitle').value, content: document.getElementById('annbody').value } });
          refresh();
        } catch (err) { msg.innerHTML = alertBox(err.message); }
      });
      document.querySelectorAll('[data-ann]').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('Delete this announcement?')) return;
        try { await api(`/api/workspaces/${wsId}/announcements/${b.dataset.ann}`, { method: 'DELETE' }); refresh(); }
        catch (err) { msg.innerHTML = alertBox(err.message); }
      }));
      document.getElementById('wsfile')?.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const form = new FormData();
          form.append('file', file);
          await api(`/api/workspaces/${wsId}/files`, { method: 'POST', form });
          refresh();
        } catch (err) { msg.innerHTML = alertBox(err.message); }
      });
    }

    // ---- Realtime chat (mirrors realtime-chat.tsx) ----
    const channelId = d.channelId;
    const log = document.getElementById('chatlog');
    let messages = [];
    let replyTo = null;
    let attachment = null;
    const supabase = sb();
    const renderChat = () => {
      const q = (document.getElementById('search').value || '').toLowerCase();
      const list = messages.filter(m => !q || (m.content || '').toLowerCase().includes(q) || (m.sender_name || '').toLowerCase().includes(q));
      log.innerHTML = list.length ? list.map(m => {
        const mine = m.sender_id === currentUserId;
        const rx = (m.reactions || []).map(r => r.emoji).join(' ');
        const atts = (m.attachments || []).map(a => `<div style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.2)"><a href="${esc(a.file_url)}" target="_blank" rel="noreferrer">📎 ${esc(a.file_name)}</a></div>`).join('');
        return `<div class="msg-col ${mine ? 'mine' : 'theirs'}">
          <div class="msg-meta">${esc(m.sender_name || '')} · ${m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}</div>
          <div class="bubble ${mine ? 'mine' : 'theirs'}">${m.parent_id ? `<div class="replyq">Replying to thread</div>` : ''}<div>${esc(m.content || '')}</div>${atts}</div>
          ${rx ? `<div style="font-size:13px">${esc(rx)}</div>` : ''}
          <div class="msg-actions"><button data-reply="${esc(m.id)}">Reply</button>${['👍', '❤️', '🎉'].map(e2 => `<button data-react="${esc(m.id)}" data-emoji="${e2}">${e2}</button>`).join('')}</div>
        </div>`;
      }).join('') : '<p style="text-align:center;color:#9CA3A0;font-size:14px;margin:auto">No messages yet. Start the conversation!</p>';
      log.scrollTop = log.scrollHeight;
      log.querySelectorAll('[data-reply]').forEach(b => b.addEventListener('click', () => {
        replyTo = messages.find(x => x.id === b.dataset.reply) || null;
        const bar = document.getElementById('replybar');
        if (replyTo) { bar.style.display = ''; bar.innerHTML = `<span>Replying to <strong>${esc(replyTo.sender_name || '')}</strong>: &ldquo;${esc((replyTo.content || '').slice(0, 40))}...&rdquo;</span><button data-x style="background:none;border:none;cursor:pointer;font-weight:bold">✕</button>`; bar.querySelector('[data-x]').addEventListener('click', () => { replyTo = null; bar.style.display = 'none'; }); }
      }));
      log.querySelectorAll('[data-react]').forEach(b => b.addEventListener('click', async () => {
        try {
          const r = await api('/api/messages/react', { method: 'POST', body: { messageId: b.dataset.react, emoji: b.dataset.emoji } });
          messages = messages.map(m => {
            if (m.id !== b.dataset.react) return m;
            const rx2 = m.reactions || [];
            if (r.reacted) { if (!rx2.some(x => x.emoji === b.dataset.emoji && x.user_id === currentUserId)) return { ...m, reactions: [...rx2, { emoji: b.dataset.emoji, user_id: currentUserId }] }; return m; }
            return { ...m, reactions: rx2.filter(x => !(x.emoji === b.dataset.emoji && x.user_id === currentUserId)) };
          });
          renderChat();
          rt.send({ type: 'broadcast', event: 'reaction', payload: { messageId: b.dataset.react, emoji: b.dataset.emoji, user_id: currentUserId, reacted: r.reacted } });
        } catch (err) { msg.innerHTML = alertBox(err.message); }
      }));
    };
    document.getElementById('search').addEventListener('input', renderChat);

    let rt = null;
    if (channelId) {
      const { data } = await supabase.from('messages').select('*, sender:sender_id(name), message_reactions(*), message_attachments(*)').eq('conversation_id', channelId).order('created_at', { ascending: true });
      messages = (data || []).map(m => ({ ...m, sender_name: m.sender?.name || 'Unknown', reactions: m.message_reactions || [], attachments: m.message_attachments || [] }));
      renderChat();
      rt = supabase.channel(`chat:${channelId}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `conversation_id=eq.${channelId}` }, async (payload) => {
          const nm = payload.new;
          const { data: u } = await supabase.from('users').select('name').eq('id', nm.sender_id).single();
          messages.push({ ...nm, sender_name: u?.name || 'User', reactions: [], attachments: [] });
          renderChat();
        })
        .on('broadcast', { event: 'typing' }, (payload) => {
          if (payload.payload.userId !== currentUserId) {
            document.getElementById('typing').textContent = `${payload.payload.userName} is typing...`;
            setTimeout(() => document.getElementById('typing').textContent = '', 3000);
          }
        })
        .on('broadcast', { event: 'reaction' }, (payload) => {
          const { messageId, emoji, user_id, reacted } = payload.payload;
          messages = messages.map(m => {
            if (m.id !== messageId) return m;
            const rx = m.reactions || [];
            if (reacted) { if (rx.some(x => x.emoji === emoji && x.user_id === user_id)) return m; return { ...m, reactions: [...rx, { emoji, user_id }] }; }
            return { ...m, reactions: rx.filter(x => !(x.emoji === emoji && x.user_id === user_id)) };
          });
          renderChat();
        });
      rt.subscribe();
    } else {
      log.innerHTML = '<p style="text-align:center;color:#9CA3A0;padding:40px">Initializing workspace communication channel...</p>';
    }

    const meProf = await api('/api/auth/profile').catch(() => ({ profile: null }));
    document.getElementById('chatinput').addEventListener('input', () => {
      if (rt) rt.send({ type: 'broadcast', event: 'typing', payload: { userId: currentUserId, userName: meProf.profile?.name || 'User' } });
    });
    document.getElementById('chatfile').addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file || !channelId) return;
      const ext = file.name.split('.').pop();
      const path = `${channelId}/${Math.random().toString(36).substring(2)}.${ext}`;
      const { error } = await supabase.storage.from('message-attachments').upload(path, file);
      if (error) { msg.innerHTML = alertBox('File upload failed: ' + error.message); return; }
      const { data } = supabase.storage.from('message-attachments').getPublicUrl(path);
      attachment = { url: data.publicUrl, name: file.name, size: file.size, type: file.type };
      msg.innerHTML = alertBox(`Attached: ${file.name}`, true);
      e.target.value = '';
    });
    document.getElementById('chatform').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chatinput');
      const text = input.value.trim();
      if ((!text && !attachment) || !channelId) return;
      input.value = '';
      const { data: nm, error } = await supabase.from('messages').insert({
        conversation_id: channelId, sender_id: currentUserId,
        parent_id: replyTo?.id || null,
        content: text || (attachment ? `Attached file: ${attachment.name}` : ''),
      }).select().single();
      if (!error && nm && attachment) {
        await supabase.from('message_attachments').insert({ message_id: nm.id, file_url: attachment.url, file_name: attachment.name, file_size: attachment.size, file_type: attachment.type });
        attachment = null;
      }
      replyTo = null; document.getElementById('replybar').style.display = 'none';
    });
  } catch (err) { msg.innerHTML = alertBox(err.message); content.innerHTML = ''; }
}
</script>
</body>
</html>
